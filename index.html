<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Medidor GLM</title>
<style>
/* Layout: barra fixa com status da trena; em tablet deitado, planta à esquerda e formulário à direita */
:root{
  --bg:#f2f1ec; --panel:#ffffff; --fg:#1b2621; --muted:#66716b; --line:#d8d5cb;
  --accent:#0f6b4f; --accent-fg:#fff; --laser:#c8321e; --warn:#a86a00; --ok:#1f7a3f;
  --room:#e4ede7; --top:#14201b; --top-fg:#eef3f0;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101614; --panel:#18211d; --fg:#e4ebe7; --muted:#90a098; --line:#2b3732;
  --accent:#3bb88a; --accent-fg:#08110d; --laser:#ff6a52; --warn:#e3a640; --ok:#5ccf86;
  --room:#1f2d27; --top:#0b100e; --top-fg:#e4ebe7; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--top-fg);display:flex;align-items:center;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
.top .tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.top .tt b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{color:#9fb0a8;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ult{font:600 1.05rem var(--mono);font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:8px;background:#ffffff14;white-space:nowrap}
.ult.flash{background:var(--laser);color:#fff}
.ic{background:transparent;border:0;color:inherit;font-size:1.3rem;min-width:44px;min-height:44px;border-radius:8px;cursor:pointer}
.btchip{display:flex;align-items:center;gap:6px;background:#ffffff14;color:var(--top-fg);border:0;border-radius:999px;padding:8px 12px;font:600 .85rem var(--body);min-height:40px;cursor:pointer}
.btchip .dot{width:10px;height:10px;border-radius:50%;background:#7c8a84}
.btchip.on .dot{background:#3bdc8f;box-shadow:0 0 0 3px #3bdc8f40}
.btchip.busy .dot{background:#e3a640}
main{max-width:1280px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{font-size:1.25rem;margin:0}
h3{font-size:1.02rem;margin:0}
label{display:block;font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:1.05rem var(--body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);min-height:48px}
textarea{resize:vertical}
input.laser{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
input.alvo{border-color:var(--laser);box-shadow:0 0 0 3px color-mix(in srgb,var(--laser) 30%,transparent);background:color-mix(in srgb,var(--laser) 6%,var(--panel))}
button,.btn{font:600 .95rem var(--body);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--laser);border-color:color-mix(in srgb,var(--laser) 40%,var(--line))}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:3px solid var(--laser);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:96px}
.card b{font-size:1.05rem}
.meta{color:var(--muted);font-size:.85rem;font-weight:400}
.pill{font:600 .75rem var(--body);padding:3px 9px;border-radius:999px;margin-top:4px}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:20px;max-width:60ch}
.vazio p{margin:.3em 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.lbl{font-weight:600;color:var(--muted)}
.exp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.exp button{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px}
.exp button span{font-weight:400;font-size:.85rem;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font:400 .9rem var(--body);color:var(--fg)}
.chk input{width:22px;min-height:22px;height:22px}
/* ambiente */
.amb{display:grid;gap:16px}
@media (min-width:900px){.amb{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.col-plan{position:sticky;top:76px;align-self:start}}
.col-plan{display:flex;flex-direction:column;gap:10px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.svgplan{width:100%;height:auto;max-height:58vh;display:block;touch-action:manipulation}
@media (max-width:899px){.svgplan{max-height:42vh}}
.pend{background:color-mix(in srgb,var(--warn) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:10px;padding:10px 14px}
.pend.ok{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.pend.bk{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pend ul{margin:6px 0 0;padding-left:20px}
.dica{margin:0;color:var(--muted);font-size:.88rem}
.orc-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.orc-tot>div{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.orc-tot>div b{font-size:1.15rem}.orc-tot>div.big{border-color:var(--ok);border-width:2px}.orc-tot>div.big b{font-size:1.45rem}
.wrap{overflow-x:auto;max-width:100%}
.tb{border-collapse:collapse;width:100%;font-size:.88rem}.tb th,.tb td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}.tb th{color:var(--muted);font-weight:600}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.walls{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:36px minmax(0,1fr) 88px 60px 40px;gap:8px;align-items:end;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.wrow.sel{border-color:var(--laser)}
.wrow .lt{font:700 1.4rem var(--mono);text-align:center;align-self:center}
.wrow.sel .lt{color:var(--laser)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{min-height:40px;padding:6px 10px;font-size:.85rem}
.quick i{width:10px;height:10px;border-radius:50%;display:inline-block}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.modelo{flex-direction:column;align-items:stretch;text-align:left;gap:4px;padding:10px 12px}
.modelo span{font-weight:400;font-size:.82rem;color:var(--muted)}
.modelo.desenhar{border:2px dashed var(--accent)}
.mini{width:100%;height:110px;display:block}
.abas{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:8px}
.abas button{flex:1;border:0;background:transparent;min-height:40px}
.abas button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 4px 8px}
.chips .sep{flex:0 0 12px}
#cv3d.real{background:#f0f0f1}
.svgplan.papel{background:#fff;border-radius:8px}
.chips button{min-height:38px;min-width:44px;padding:4px 12px}
#cv3d{border:0;width:100%;height:min(60vh,620px);display:block;touch-action:none;cursor:grab;border-radius:8px}
@media (max-width:899px){#cv3d{height:46vh}}
.metr{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.metr summary{font-weight:700}
.tela-desenho{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
#pad{width:100%;height:min(62vh,640px);display:block;touch-action:none;cursor:crosshair}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;color:#fff;font-weight:700;font-size:.85rem;flex:none}
.itens{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:8px}
.ih{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px;gap:8px}
.ihm{grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr) 44px;align-items:center}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--room)}
.menu{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(60px + env(safe-area-inset-top));z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:240px;box-shadow:0 10px 30px #0004}
.menu button{border:0;justify-content:flex-start;background:transparent}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab button{box-shadow:0 6px 18px #0005}
.fab #fabLaser{min-height:44px;font-size:.85rem}
.fab #fabLaser.on{background:var(--laser);color:#fff;border-color:var(--laser)}
.fabm{width:96px;height:96px;border-radius:50%;background:var(--laser);color:#fff;border:0;font:800 1.15rem var(--body);letter-spacing:.04em}
.fabm:disabled{opacity:.7}
main{padding-bottom:140px!important}
.canto{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.canto .res{font:700 1.3rem var(--mono)}
.angb{min-height:48px;width:100%;font-family:var(--mono)}
.editor{position:fixed;inset:0;z-index:60;background:#0b0f0d;color:#eef3f0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.editor button{background:#1f2a25;color:#eef3f0;border-color:#33433b}
.editor button.primary{background:#3bb88a;color:#08110d;border-color:#3bb88a}
.edtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button[aria-pressed="true"]{background:#eef3f0;color:#0b0f0d}
.cores{display:flex;gap:8px}
.cores button{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;background:var(--k);border:3px solid #33433b}
.cores button[aria-pressed="true"]{border-color:#eef3f0;outline:2px solid #0b0f0d}
.edwrap{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:4px}
#edc{touch-action:none;max-width:100%;max-height:100%;border-radius:4px}
.edbar{min-height:72px;padding:10px max(140px,env(safe-area-inset-right)) 10px 12px;background:#141c18;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#cfdad4}
.edbar input{background:#0b0f0d;color:#eef3f0;border-color:#33433b;max-width:260px}
.edbar input.alvo{border-color:#ff5a3c;box-shadow:0 0 0 3px #ff5a3c55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));z-index:40;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;max-width:min(92vw,560px);text-align:center}
.viewer{position:fixed;inset:0;z-index:50;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.viewer img{max-width:100%;max-height:80vh;border-radius:8px}
pre{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:50vh;overflow:auto}
.ajuda h3{margin-top:10px}
.ajuda p,.ajuda li{max-width:70ch}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <button id="voltar" class="ic" aria-label="Voltar" hidden>←</button>
  <div class="tt"><b id="titulo">Medidor GLM</b><small id="sub"></small></div>
  <div class="ult" id="ult" title="Última leitura da trena">— mm</div>
  <button id="bt" class="btchip"><span class="dot"></span><span id="btTxt">Conectar trena</span></button>
  <button id="menuBtn" class="ic" aria-label="Menu">⋮</button>
</header>
<div id="menu" class="menu" hidden>
  <button data-a="mTodos">Procurar todos os aparelhos</button>
  <button data-a="mDesc">Desconectar trena</button>
  <button data-a="carregarPrecos">Carregar preços (do FreeCAD)</button>
  <button data-a="mAjuda">Como usar e exportar</button>
  <button data-a="mDiag">Diagnóstico do Bluetooth</button>
</div>
<main id="main"></main>
<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden>
<input type="file" id="precoFile" accept=".json,.txt,application/json,text/plain" hidden>
<div id="fab" class="fab" hidden>
  <button id="fabLaser" type="button">Ligar laser (mirar)</button>
  <button id="fabMedir" type="button" class="fabm">MEDIR</button>
</div>
<div id="toast" class="toast" hidden></div>
<div id="viewer" class="viewer" hidden>
  <img id="vimg" alt="Foto">
  <div class="row wrap"><button id="vedit">✏️ Anotar medidas</button><button id="vdel" class="danger">Apagar foto</button><button id="vclose" class="primary">Fechar</button></div>
</div>
<div id="editor" class="editor" hidden>
  <div class="edtop">
    <div class="tools" id="edTools" role="toolbar" aria-label="Ferramentas">
      <button data-t="cota">↔ Cota</button><button data-t="seta">↗ Seta</button><button data-t="texto">T Nota</button><button data-t="mover">✋ Mover</button>
    </div>
    <div class="cores" id="edCores" aria-label="Cor">
      <button data-c="#ffd400" style="--k:#ffd400" aria-label="Amarelo"></button><button data-c="#ff3b2f" style="--k:#ff3b2f" aria-label="Vermelho"></button><button data-c="#2fd3ff" style="--k:#2fd3ff" aria-label="Azul"></button><button data-c="#ffffff" style="--k:#ffffff" aria-label="Branco"></button>
    </div>
    <div class="row"><button id="edUndo">Desfazer</button><button id="edCancel">Cancelar</button><button id="edSave" class="primary">Salvar</button></div>
  </div>
  <div class="edwrap" id="edWrap"><canvas id="edc"></canvas></div>
  <div class="edbar" id="edBar"></div>
</div>

<script>
'use strict';
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null};
const LETRAS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const asc=t=>String(t??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,'');
const slug=t=>asc(t).trim().replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'projeto';
let tT;function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,ms)}
function dupla(b){if(b.dataset.c){delete b.dataset.c;return true}const o=b.textContent;b.dataset.c=1;b.textContent='Toque de novo para confirmar';setTimeout(()=>{if(b.dataset.c){delete b.dataset.c;b.textContent=o}},3000);return false}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const PLACAS=[['T','1 tomada (4x2)'],['TT','2 tomadas (4x2)'],['TTT','3 tomadas (4x2)'],['I','1 interruptor (4x2)'],['II','2 interruptores (4x2)'],['III','3 interruptores (4x2)'],['IT','1 interruptor + tomada'],['IIT','2 interruptores + tomada'],['ITT','1 interruptor + 2 tomadas'],['TTTT','4 tomadas (4x4)'],['TTTTTT','6 tomadas (4x4)'],['IIITTT','3 interruptores + 3 tomadas (4x4)']];
const MOVEIS={
  inferior:{n:'Inferior / balcão',tipo:'inferior',larg:600,alt:870,prof:580,z:0,portas:2,gavetas:0,prats:1,base:1},
  gabinete:{n:'Gabinete de banheiro',tipo:'inferior',larg:800,alt:870,prof:450,z:0,portas:2,gavetas:0,prats:1,base:1},
  gaveteiro:{n:'Gaveteiro',tipo:'inferior',larg:500,alt:870,prof:580,z:0,portas:0,gavetas:3,prats:0,base:1},
  aereo:{n:'Aéreo',tipo:'aereo',larg:600,alt:700,prof:350,z:1500,portas:2,gavetas:0,prats:1,base:0},
  espelheira:{n:'Espelheira / aéreo raso',tipo:'aereo',larg:800,alt:700,prof:150,z:1200,portas:2,gavetas:0,prats:2,base:0},
  torre:{n:'Torre / alto',tipo:'torre',larg:600,alt:2200,prof:580,z:0,portas:2,gavetas:0,prats:4,base:1},
  torre_quente:{n:'Torre quente',tipo:'torre_quente',larg:600,alt:2300,prof:660,z:0,portas:0,gavetas:2,prats:0,base:1},
  cooktop:{n:'Balcão cooktop',tipo:'cooktop',larg:800,alt:870,prof:580,z:0,portas:0,gavetas:2,prats:0,base:1},
  canto_l_esq:{n:'Canto L (canto à esquerda)',tipo:'canto_l_esq',larg:900,alt:870,prof:900,z:0,portas:2,gavetas:0,prats:1,base:1},
  canto_l_dir:{n:'Canto L (canto à direita)',tipo:'canto_l_dir',larg:900,alt:870,prof:900,z:0,portas:2,gavetas:0,prats:1,base:1},
  canto_reto_esq:{n:'Canto reto (cega à esquerda)',tipo:'canto_reto_esq',larg:1000,alt:870,prof:580,z:0,portas:1,gavetas:0,prats:1,base:1},
  canto_reto_dir:{n:'Canto reto (cega à direita)',tipo:'canto_reto_dir',larg:1000,alt:870,prof:580,z:0,portas:1,gavetas:0,prats:1,base:1},
  guarda_roupa:{n:'Guarda-roupa (caixa inteira)',tipo:'guarda_roupa',larg:1000,alt:2400,prof:580,z:0,portas:2,gavetas:2,prats:2,base:1},
  guarda_roupa_2:{n:'Guarda-roupa em 2 caixas (corpo + maleiro)',tipo:'guarda_roupa_2',larg:1000,alt:2400,prof:580,z:0,portas:2,gavetas:2,prats:2,base:1}
};
const BASES=['Nenhuma (direto no chão)','Rodapé','Rodízio','Pés parafusados','Pé nivelador + saia'];
const ehAereo=m=>m.tipo==='aereo'||(+m.z||0)>=1000;
const TIPOS={
  porta:{n:'Porta',ab:1,cor:'#b8682c'},
  janela:{n:'Janela',ab:1,cor:'#2c80b8'},
  vao:{n:'Vão / passagem',ab:1,cor:'#7d8a84'},
  viga:{n:'Viga / pilar',ab:1,cor:'#8b4fb0'},
  tomada:{n:'Tomada',cor:'#d69a00'},
  interruptor:{n:'Interruptor',cor:'#c97f00'},
  luz:{n:'Ponto de luz',cor:'#e0b400'},
  agua:{n:'Água',cor:'#1d8fd6'},
  esgoto:{n:'Esgoto',cor:'#7a5230'},
  gas:{n:'Gás',cor:'#d6451d'},
  ar:{n:'Ar-condicionado',cor:'#17a594'},

  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const dbAll=s=>tx(s,'readonly',st=>st.getAll());

const letra=(id,a=A)=>{const i=a?a.paredes.findIndex(w=>w.id===id):-1;return i<0?'?':LETRAS[i]};

/* ================= geometria ================= */
// Paredes em sequência, andando para a DIREITA (sentido horário visto de cima).
// "ang" = ângulo interno do canto no FIM da parede (90 normal, 270 canto para dentro).
function geo(a){
  let x=0,y=0,d=(+a.giro||0)*Math.PI/180;const pts=[{x,y}],ws=[];
  a.paredes.forEach(w=>{const L=w.L||w.Lp||1000;const ux=Math.cos(d),uy=Math.sin(d);
    ws.push({ax:x,ay:y,bx:x+L*ux,by:y+L*uy,ux,uy,L,ok:!!w.L});x+=L*ux;y+=L*uy;pts.push({x,y});
    d-=(180-(+w.ang||90))*Math.PI/180;});
  let ar=0;for(let i=0;i<pts.length-1;i++)ar+=pts[i].x*pts[i+1].y-pts[i+1].x*pts[i].y;
  const ccw=ar>0;
  ws.forEach(w=>{const lx=-w.uy,ly=w.ux;w.esq=!ccw;w.ix=ccw?lx:-lx;w.iy=ccw?ly:-ly;w.ox=-w.ix;w.oy=-w.iy});
  const fech=ws.length>=3?Math.hypot(x,y):null;
  const fechado=fech!=null&&fech<20&&a.paredes.every(w=>w.L);
  return {pts,ws,fech,fechado};
}
const fotosAmb=a=>[...a.fotos,...a.paredes.flatMap(w=>w.fotos||[]),...a.itens.flatMap(i=>i.fotos)];
const rotTxt=(ux,uy)=>{let r=Math.atan2(uy,ux)*180/Math.PI;if(r>90)r-=180;if(r<=-90)r+=180;return r};

/* ================= pendências ================= */
function pendencias(a){
  const r=[];if(!a.peDireito)r.push('Medir o pé-direito');
  a.paredes.forEach((w,i)=>{if(!w.L)r.push('Medir a parede '+LETRAS[i])});
  const g=geo(a);
  if(g.fech!=null&&a.paredes.every(w=>w.L)&&g.fech>20)r.push(`A planta não fecha por ${Math.round(g.fech)} mm — confira as medidas e os cantos`);
  a.itens.forEach(it=>{const t=TIPOS[it.tipo]||TIPOS.outro;const n=`${t.n} (parede ${letra(it.parede,a)})`;
    if(it.dist==null)r.push(n+': falta a distância');
    if(it.alt==null)r.push(n+': falta a altura do piso');
    else if(a.peDireito&&it.alt>a.peDireito)r.push(n+`: altura ${it.alt} mm passa do pé-direito (${a.peDireito}) — confira`);
    if(it.dist!=null&&(()=>{const w=a.paredes.find(x=>x.id===it.parede);return w&&w.L&&it.dist>w.L})())r.push(n+': distância maior que a parede — confira');
    if(t.ab&&(!it.larg||!it.h))r.push(n+': falta largura ou altura')});
  (a.moveis||[]).forEach(m=>{const w=a.paredes.find(x=>x.id===m.parede),n=`${(MOVEIS[m.k]||{}).n||'Móvel'} (parede ${letra(m.parede,a)})`;
    if(!m.larg||!m.alt||!m.prof)r.push(n+': falta largura, altura ou profundidade');
    else if(w&&w.L&&(+m.dist||0)+(+m.larg)>w.L+1)r.push(n+`: passa do fim da parede (${(+m.dist||0)+(+m.larg)} > ${w.L})`)});
  if(!a.fotos.length)r.push('Tirar ao menos uma foto do ambiente');
  return r;
}
function pendHTML(pe){return pe.length?`<div class="pend"><b>Falta (${pe.length})</b><ul>${pe.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:`<div class="pend ok"><b>Ambiente completo.</b> Tudo medido e fotografado.</div>`}

/* ================= planta (SVG) ================= */
// ---------------- planta (paredes com espessura, portas com abertura, janelas)
function planSVGreal(a,g,opt={}){const T=ESP_PAREDE;
  const xs=g.pts.map(p=>p.x),ys=g.pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const span=Math.max(x1-x0,y1-y0,1500),pad=span*.16+T,fs=span/26;x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  const fech=g.ws.length>=3&&g.fech<50,n=g.ws.length,ext=ang=>T/Math.tan((+ang||90)*Math.PI/360);
  let s=`<svg class="svgplan papel" style="--room:#e9eeea;--fg:#1b2621;--panel:#ffffff;--warn:#a86a00;--laser:#c8321e;--accent:#0f6b4f;--muted:#66716b" viewBox="${x0.toFixed(0)} ${(-y1).toFixed(0)} ${(x1-x0).toFixed(0)} ${(y1-y0).toFixed(0)}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" role="img" aria-label="Planta do ambiente">`;
  if(fech)s+=`<polygon points="${g.pts.slice(0,-1).map(p=>p.x.toFixed(1)+','+(-p.y).toFixed(1)).join(' ')}" style="fill:var(--room,#e4ede7)"/>`;
  const P2=(w,u,nn)=>[(w.ax+w.ux*u+w.ix*nn).toFixed(1),(-(w.ay+w.uy*u+w.iy*nn)).toFixed(1)].join(',');
  g.ws.forEach((w,i)=>{const pw=a.paredes[i],id=pw.id,sel=opt.sel===id,miss=!w.ok;
    const e0=(fech||i>0)?ext(a.paredes[(i-1+n)%n].ang):0,e1=(fech||i<n-1)?ext(pw.ang):0;
    s+=`<polygon points="${P2(w,0,0)} ${P2(w,w.L,0)} ${P2(w,w.L+e1,-T)} ${P2(w,-e0,-T)}" style="fill:${miss?'#a9aeb3':'#3f454b'};stroke:${sel?'var(--laser,#c8321e)':(miss?'#6b7177':'#2a2e33')};stroke-width:${sel?3.5:1.2}px;${miss?'stroke-dasharray:7 5;':''}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
    // aberturas
    for(const it of a.itens.filter(x=>x.parede===id)){const t=TIPOS[it.tipo]||TIPOS.outro;if(!t.ab||it.tipo==='viga')continue;
      const L0=+it.dist||0,lg=+it.larg||(it.tipo==='janela'?1200:800),L1=L0+lg;
      s+=`<polygon points="${P2(w,L0,1)} ${P2(w,L1,1)} ${P2(w,L1,-T-1)} ${P2(w,L0,-T-1)}" style="fill:var(--panel,#fff)"/>`;
      s+=`<line x1="${P2(w,L0,0).split(',')[0]}" y1="${P2(w,L0,0).split(',')[1]}" x2="${P2(w,L0,-T).split(',')[0]}" y2="${P2(w,L0,-T).split(',')[1]}" stroke="#2a2e33" stroke-width="1.2" vector-effect="non-scaling-stroke"/><line x1="${P2(w,L1,0).split(',')[0]}" y1="${P2(w,L1,0).split(',')[1]}" x2="${P2(w,L1,-T).split(',')[0]}" y2="${P2(w,L1,-T).split(',')[1]}" stroke="#2a2e33" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
      if(it.tipo==='janela'){for(const nn of [-T*.25,-T*.5,-T*.75])s+=`<polyline points="${P2(w,L0,nn)} ${P2(w,L1,nn)}" fill="none" stroke="${t.cor}" stroke-width="${nn===-T*.5?1:1.6}" vector-effect="non-scaling-stroke"/>`}
      else if(it.tipo==='porta'){const dir=it.dob==='d',hu=dir?L1:L0,ou=dir?L0:L1,dentro=it.abre!=='fora',nb=dentro?0:-T,sg=dentro?1:-1;
        const pts=[];for(let k=0;k<=18;k++){const th=k/18*Math.PI/2;pts.push(P2(w,hu+(ou-hu)*Math.sin(th),nb+sg*lg*Math.cos(th)))}
        s+=`<polyline points="${P2(w,hu,nb)} ${P2(w,hu,nb+sg*lg)}" fill="none" stroke="${t.cor}" stroke-width="2.4" vector-effect="non-scaling-stroke"/><polyline points="${pts.join(' ')}" fill="none" stroke="${t.cor}" stroke-width="1.1" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`}
      else s+=`<polyline points="${P2(w,L0,-T/2)} ${P2(w,L1,-T/2)}" fill="none" stroke="${t.cor}" stroke-width="1" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>`}
    s+=`<line x1="${w.ax}" y1="${-w.ay}" x2="${w.bx}" y2="${-w.by}" stroke="transparent" stroke-width="${fs*1.8}" data-a="selW" data-id="${id}" style="cursor:pointer"/>`;
    const mx=(w.ax+w.bx)/2+w.ix*fs*1.6,my=-((w.ay+w.by)/2+w.iy*fs*1.6),r=rotTxt(w.ux,-w.uy);
    s+=`<text x="${mx}" y="${my}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${r} ${mx} ${my})" style="fill:${miss?'var(--warn,#a86a00)':(sel?'var(--laser,#c8321e)':'var(--fg,#1b2621)')};font-weight:700" data-a="selW" data-id="${id}">${LETRAS[i]} · ${miss?'?':Math.round(w.L)}</text>`});
  if(g.ws.length){const w=g.ws[0];s+=`<circle cx="${w.ax}" cy="${-w.ay}" r="${fs*.32}" style="fill:var(--accent,#0f6b4f)"/>`}
  (a.moveis||[]).forEach((m,mi)=>{const i=a.paredes.findIndex(w=>w.id===m.parede);if(i<0||!m.larg||!m.prof)return;const w=g.ws[i],d0=+m.dist||0,d1=d0+(+m.larg),pr=+m.prof,ae=ehAereo(m),cm=corMovel(m);
    const c=[[d0,0],[d1,0],[d1,pr],[d0,pr]].map(([u,nn])=>[w.ax+w.ux*u+w.ix*nn,-(w.ay+w.uy*u+w.iy*nn)]);
    s+=`<polygon points="${c.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" style="fill:${ae?'none':cm};fill-opacity:.28;stroke:${cm};stroke-width:2.2px;${ae?'stroke-dasharray:8 6;':''}" vector-effect="non-scaling-stroke" data-a="selW" data-id="${m.parede}"/>`;
    if(!ae&&(+m.portas||0)){const f=[[d0,pr],[d1,pr]].map(([u,nn])=>[w.ax+w.ux*u+w.ix*nn,-(w.ay+w.uy*u+w.iy*nn)]);s+=`<line x1="${f[0][0]}" y1="${f[0][1]}" x2="${f[1][0]}" y2="${f[1][1]}" stroke="${cm}" stroke-width="3.5" vector-effect="non-scaling-stroke"/>`}
    const mx=(c[0][0]+c[2][0])/2,my=(c[0][1]+c[2][1])/2;s+=`<text x="${mx}" y="${my}" font-size="${fs*.6}" text-anchor="middle" dominant-baseline="middle" style="fill:${cm};font-weight:700">M${mi+1} · ${m.larg}</text>`});
  a.itens.forEach(it=>{const i=a.paredes.findIndex(w=>w.id===it.parede);if(i<0)return;const w=g.ws[i],t=TIPOS[it.tipo]||TIPOS.outro,d=it.dist||0;
    if(it.tipo==='viga'){const d2=d+(it.larg||300);s+=`<polyline points="${P2(w,d,0)} ${P2(w,d,250)} ${P2(w,d2,250)} ${P2(w,d2,0)}" fill="none" stroke="${t.cor}" stroke-width="1.5" stroke-dasharray="8 5" vector-effect="non-scaling-stroke"/>`}
    else if(!t.ab){const cx=w.ax+w.ux*d+w.ix*fs*.75,cy=-(w.ay+w.uy*d+w.iy*fs*.75);
      s+=`<circle cx="${cx}" cy="${cy}" r="${fs*.45}" fill="${t.cor}"/><text x="${cx}" y="${cy}" font-size="${fs*.55}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700">${esc(t.n[0])}</text>`}});
  s+=extrasPlanta(a,g,fs,true);s+=cotasInternasPlanta(a,g,fs,T,true);
  return s+'</svg>'}

  const k=Math.min((r.width-8)/ED.img.width,(r.height-8)/ED.img.height);const cw=Math.max(50,ED.img.width*k),ch=Math.max(50,ED.img.height*k),d=devicePixelRatio||1;

function rotuloCota(a){const v=String(a.v??'').trim();if(!v)return '?';return /^\d+([.,]\d+)?$/.test(v)?v.replace('.',',')+' mm':v}
function seta(ctx,x,y,ang,t){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-t*Math.cos(ang-.45),y-t*Math.sin(ang-.45));ctx.lineTo(x-t*Math.cos(ang+.45),y-t*Math.sin(ang+.45));ctx.closePath();ctx.fill();ctx.stroke()}
function edAnot(ctx,a,base,sel){
  const lw=base/260,fs=base/24,cor=a.cor||'#ffd400';ctx.lineCap='round';ctx.lineJoin='round';
  if(a.t==='cota'||a.t==='seta'){const ang=Math.atan2(a.y2-a.y1,a.x2-a.x1),t=lw*7;
    for(const pass of [0,1]){ctx.strokeStyle=pass?cor:'rgba(0,0,0,.75)';ctx.fillStyle=pass?cor:'rgba(0,0,0,.75)';ctx.lineWidth=pass?lw:lw*2.6;
      ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();
      ctx.lineWidth=pass?lw*.6:lw*2;seta(ctx,a.x2,a.y2,ang,t);
      if(a.t==='cota'){seta(ctx,a.x1,a.y1,ang+Math.PI,t);
        const px=-Math.sin(ang)*t*1.1,py=Math.cos(ang)*t*1.1;ctx.lineWidth=pass?lw:lw*2.6;
        for(const [x,y] of [[a.x1,a.y1],[a.x2,a.y2]]){ctx.beginPath();ctx.moveTo(x-px,y-py);ctx.lineTo(x+px,y+py);ctx.stroke()}}}
    if(a.t==='cota'){const txt=rotuloCota(a),mx=(a.x1+a.x2)/2,my=(a.y1+a.y2)/2;let r=ang;if(r>Math.PI/2)r-=Math.PI;if(r<-Math.PI/2)r+=Math.PI;

// ---- plano de corte (PlanoDeCorte.otimizar)
function _ors(it,transp){let o=it.veio?[[it.l,it.c]]:[[it.l,it.c],[it.c,it.l]];if(transp)o=o.map(([w,h])=>[h,w]);const s=new Set,r=[];for(const x of o){const k=x.join('x');if(!s.has(k)){s.add(k);r.push(x)}}return r}
function _empacotar(itens,W,H,K,transp,ordem,pol){

  const lst=[...itens].sort((a,b)=>{const x=chave(a),y=chave(b);return y[0]-x[0]||y[1]-x[1]});
  for(const it of lst){let ors=_ors(it,transp);if(pol==='baixa')ors=[ors.reduce((a,b)=>b[1]<a[1]?b:a)];else if(pol==='alta')ors=[ors.reduce((a,b)=>b[1]>a[1]?b:a)];
    let melhor=null;const cmp=(a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2];
    for(const [w,h] of ors){if(w>W||h>H)continue;
      chapas.forEach((ch,si)=>{for(const f of ch.faixas){for(const b of f.blocos)if(w<=b.w&&b.usado+h<=f.h){const k=[si,0,(b.w-w)+(f.h-b.usado-h)*0.01];if(!melhor||cmp(k,melhor[0])<0)melhor=[k,'pilha',ch,f,b,w,h]}
          if(h<=f.h&&f.usado+w<=W){const k=[si,1,(f.h-h)*2+w*0.001];if(!melhor||cmp(k,melhor[0])<0)melhor=[k,'bloco',ch,f,null,w,h]}}
        if(ch.usado+h<=H){const k=[si,2,h];if(!melhor||cmp(k,melhor[0])<0)melhor=[k,'faixa',ch,null,null,w,h]}})}
    if(!melhor){const val=ors.filter(o=>o[0]<=W&&o[1]<=H);if(!val.length)throw new Error(`Peça maior que a chapa: ${it.d} ${it.c}x${it.l}`);
      const [w,h]=val.reduce((a,b)=>b[1]<a[1]?b:a);const ch={usado:0,faixas:[]};chapas.push(ch);melhor=[null,'faixa',ch,null,null,w,h]}
    let [,modo,ch,f,b,w,h]=melhor;
    if(modo==='faixa'){f={y:ch.usado,h,usado:0,blocos:[]};ch.faixas.push(f);ch.usado+=h+K}
    if(modo==='faixa'||modo==='bloco'){b={x:f.usado,w,usado:0,pecas:[]};f.blocos.push(b);f.usado+=w+K}
    b.pecas.push([b.usado,w,h,it]);b.usado+=h+K}
  return chapas}
function _cortes(ch,W,H,K){let n=ch.faixas.length-((ch.usado-K)>=H?1:0);
  for(const f of ch.faixas){n+=f.blocos.length-((f.usado-K)>=W?1:0);for(const b of f.blocos){n+=b.pecas.length-((b.usado-K)>=f.h?1:0);n+=b.pecas.filter(p=>p[1]<b.w).length}}return n}
function otimizar(itens,SW,SH,REF,K){const LW=SH-2*REF,LH=SW-2*REF;let best=null;
  for(const transp of [false,true])for(const ordem of ['h','area','w'])for(const pol of ['baixa','alta','livre']){
    const [W,H]=transp?[LH,LW]:[LW,LH];let chs;try{chs=_empacotar(itens,W,H,K,transp,ordem,pol)}catch(e){continue}

  if(!best)throw new Error('Não foi possível encaixar as peças');return {chapas:best.chs.length,cortes:best.sc[2]}}

function nomeMovel(m){const p=+m.portas||0,g=+m.gavetas||0,pr=+m.prats||0;

    const r=pecasMovel(m),f=ferragensMovel(m,r),it={amb:a.nome,m,desc:nomeMovel(m),pecas:r.pecas.flatMap(emendar),aprox:r.aprox,ferr:f,area:{},fita:{}};

    const it={amb:a.nome,m:mv,av:1,desc:nomeAvulsa(v),pecas:r.pecas.flatMap(emendar),aprox:false,ferr:r.ferr,area:{},fita:{}};
    for(const pc of it.pecas){it.area[pc.mat]=(it.area[pc.mat]||0)+pc.c*pc.l/1e6;const fm=((pc.fita[0]+pc.fita[1])*pc.c+(pc.fita[2]+pc.fita[3])*pc.l)/1000;if(fm)it.fita[pc.mat]=(it.fita[pc.mat]||0)+fm;todas.push(pc)}
    itens.push(it)}

  const [SW,SH,REF,K]=PRECOS.chapa||[2740,1840,10,4],mats={};let cortes=0;const porMat={};

function miniPlan(paredes,giro){const g=geo({paredes,giro}),xs=g.pts.map(p=>p.x),ys=g.pts.map(p=>p.y);

  let s=`<svg viewBox="${x0-pd} ${-y1-pd} ${x1-x0+2*pd} ${y1-y0+2*pd}" class="mini" aria-hidden="true">`;
  if(fech)s+=`<polygon points="${g.pts.slice(0,-1).map(p=>p.x+','+(-p.y)).join(' ')}" style="fill:var(--room)"/>`;

  g.ws.forEach((w,i)=>{const mx=(w.ax+w.bx)/2+w.ix*sp*.08,my=-((w.ay+w.by)/2+w.iy*sp*.08);s+=`<text x="${mx}" y="${my}" font-size="${sp*.09}" text-anchor="middle" dominant-baseline="central" style="fill:var(--muted);font-weight:700">${LETRAS[i]}</text>`});
  const w=g.ws[0];if(w)s+=`<circle cx="${w.ax}" cy="${-w.ay}" r="${sp*.035}" style="fill:var(--accent)"/>`;
  return s+'</svg>'}

function _rdp(p,eps){if(p.length<3)return p.slice();const [a,b]=[p[0],p[p.length-1]],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
  let mx=-1,ix=0;for(let i=1;i<p.length-1;i++){const d=Math.abs(dy*p[i].x-dx*p[i].y+b.x*a.y-b.y*a.x)/L;if(d>mx){mx=d;ix=i}}
  if(mx>eps)return [..._rdp(p.slice(0,ix+1),eps).slice(0,-1),..._rdp(p.slice(ix),eps)];return [a,b]}
const _norm=a=>{a%=360;if(a>180)a-=360;if(a<=-180)a+=360;return a};
function _snap(deg){const r90=Math.round(deg/90)*90;if(Math.abs(_norm(deg-r90))<=20)return _norm(r90);return _norm(Math.round(deg/45)*45)}

function processarDesenho(raw){
  if(raw.length<8)return null;
  const xs=raw.map(p=>p.x),ys=raw.map(p=>p.y),diag=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));if(diag<80)return null;
  const p0=raw[0],pn=raw[raw.length-1],fechado=Math.hypot(pn.x-p0.x,pn.y-p0.y)<diag*.18;
  const pts=raw.map(p=>({x:p.x,y:-p.y}));if(fechado)pts[pts.length-1]={...pts[0]};
  let s;if(fechado){let k=0,md=-1;pts.forEach((q,i)=>{const d=Math.hypot(q.x-pts[0].x,q.y-pts[0].y);if(d>md){md=d;k=i}});
    s=[..._rdp(pts.slice(0,k+1),diag*.045).slice(0,-1),..._rdp(pts.slice(k),diag*.045)]}else s=_rdp(pts,diag*.045);
  let seg=[];
  for(let i=0;i<s.length-1;i++){const dx=s[i+1].x-s[i].x,dy=s[i+1].y-s[i].y,L=Math.hypot(dx,dy);if(L>0)seg.push({h:_snap(Math.atan2(dy,dx)*180/Math.PI),L})}
  const juntar=()=>{let ch=true;while(ch&&seg.length>1){ch=false;
      for(let i=0;i<seg.length;i++){const j=(i+1)%seg.length;if(!fechado&&j===0)break;
        if(seg[i].h===seg[j].h&&i!==j){seg[i].L+=seg[j].L;seg.splice(j,1);if(j<i)i--;ch=true;break}}}};
  juntar();
  const minL=diag*.06;let mud=true;
  while(mud&&seg.length>(fechado?3:1)){mud=false;const i=seg.findIndex(x=>x.L<minL);if(i>=0){seg.splice(i,1);juntar();mud=true}}
  seg=seg.filter((x,i,a)=>!(a.length>1&&Math.abs(_norm(x.h-a[(i+1)%a.length].h))===180&&(fechado||i<a.length-1)));
  if(fechado&&seg.length<3)return null;if(!seg.length)return null;
  // orientação: as paredes andam no sentido horário (giro à direita)
  const vira=(a,b)=>_norm(a.h-b.h);
  let soma=0;for(let i=0;i<seg.length-(fechado?0:1);i++)soma+=vira(seg[i],seg[(i+1)%seg.length]);
  if(soma<0){const inv=x=>({h:_norm(x.h+180),L:x.L});
    seg=fechado?[inv(seg[0]),...seg.slice(1).reverse().map(inv)]:seg.slice().reverse().map(inv)}
  // fecha a planta distribuindo a diferença (mínimos quadrados) sem mudar ângulos
  if(fechado){const u=seg.map(x=>[Math.cos(x.h*Math.PI/180),Math.sin(x.h*Math.PI/180)]);
    const ex=seg.reduce((t,x,i)=>t+x.L*u[i][0],0),ey=seg.reduce((t,x,i)=>t+x.L*u[i][1],0);
    let a=0,b=0,c=0;u.forEach(([ux,uy])=>{a+=ux*ux;b+=ux*uy;c+=uy*uy});const det=a*c-b*b;
    if(Math.abs(det)>1e-6){const l1=(c*ex-b*ey)/det,l2=(a*ey-b*ex)/det,nv=seg.map((x,i)=>x.L-(l1*u[i][0]+l2*u[i][1]));
      if(nv.every(v=>v>minL*.5))seg.forEach((x,i)=>x.L=nv[i])}}
  const ang=seg.map((x,i)=>{if(!fechado&&i===seg.length-1)return 90;return Math.round(180-vira(x,seg[(i+1)%seg.length]))});
  const esc_=4000/Math.max(...seg.map(x=>x.L)),Lp=seg.map(x=>Math.round(x.L*esc_/10)*10),giro=seg[0].h;
  // prévia sobre a tela
  let x=0,y=0;const P2=[{x,y}];seg.forEach(sg=>{x+=sg.L*Math.cos(sg.h*Math.PI/180);y+=sg.L*Math.sin(sg.h*Math.PI/180);P2.push({x,y})});
  const bx=Math.min(...P2.map(p=>p.x)),by=Math.max(...P2.map(p=>p.y)),bw=Math.max(...P2.map(p=>p.x))-bx||1,bh=by-Math.min(...P2.map(p=>p.y))||1;
  const k=Math.min(800/bw,520/bh),ox=500-bw*k/2,oy=350-bh*k/2,T=p=>[ox+(p.x-bx)*k,oy+(by-p.y)*k];
  let svg=fechado?`<polygon points="${P2.slice(0,-1).map(p=>T(p).join(',')).join(' ')}" style="fill:var(--room)"/>`:'';
  svg+=`<polyline points="${P2.map(p=>T(p).join(',')).join(' ')}" fill="none" style="stroke:var(--fg)" stroke-width="6" stroke-linejoin="round"/>`;
  seg.forEach((sg,i)=>{const [ax,ay]=T(P2[i]),[cx,cy]=T(P2[i+1]),mx=(ax+cx)/2,my=(ay+cy)/2,h=sg.h*Math.PI/180;
    const nx=-Math.sin(h)*-1,ny=-Math.cos(h)*-1;// para dentro (lado direito do sentido)
    svg+=`<circle cx="${mx+nx*34}" cy="${my+ny*34}" r="22" style="fill:var(--accent)"/><text x="${mx+nx*34}" y="${my+ny*34}" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700">${LETRAS[i]}</text>`});
  const [sx,sy]=T(P2[0]);svg+=`<circle cx="${sx}" cy="${sy}" r="12" style="fill:var(--accent)"/>`;
  return {Lp,ang,giro,fechado,svg}}

function ligarPad(){const pad=$('#pad');if(!pad||pad._ok)return;pad._ok=1;let pts=null;
  const pt=e=>{const r=pad.getBoundingClientRect(),k=Math.max(1000/r.width,700/r.height),ox=(r.width*k-1000)/2,oy=(r.height*k-700)/2;return {x:(e.clientX-r.left)*k-ox,y:(e.clientY-r.top)*k-oy}};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);pts=[pt(e)];if(desenho&&desenho.res){desenho=null;render();return}});
  pad.addEventListener('pointermove',e=>{if(!pts)return;e.preventDefault();const p=pt(e),q=pts[pts.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>3){pts.push(p);$('#traco').setAttribute('points',pts.map(v=>v.x.toFixed(0)+','+v.y.toFixed(0)).join(' '))}});
  const fim=()=>{if(!pts)return;const raw=pts;pts=null;const res=processarDesenho(raw);
    if(!res){$('#traco').setAttribute('points','');toast('Não entendi o desenho. Risque o contorno sem tirar o dedo da tela.');return}
    desenho={res};render()};
  pad.addEventListener('pointerup',fim);pad.addEventListener('pointercancel',fim)}

function coresMovel(m){if(estilo==='cores_'){const c=corMovel(m);return {cx:mistura(c,'#ffffff',.55),fr:mistura(c,'#ffffff',.25)}}
  const mc=m.matCaixa||(typeof PRECOS!=='undefined'&&PRECOS?matPadrao('Caixa'):''),mf=m.matFrente||(typeof PRECOS!=='undefined'&&PRECOS?matPadrao('Frente'):'');

function _rgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const v=parseInt(h,16);return [v>>16&255,v>>8&255,v&255]}
function mistura(a,b,t){const x=_rgb(a),y=_rgb(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function sombra(h,k){const x=_rgb(h);return `rgb(${x.map(v=>Math.max(0,Math.min(255,Math.round(v*k)))).join(',')})`}

function paineisFrente(m){const L=+m.larg||0,Ht=+m.alt||0,ae=ehAereo(m),b=+m.base||0,rod=ae?0:(b===1?100:b===4?100:b>1?70:0);

  g.ws.forEach((w,i)=>{const its=a.itens.filter(x=>x.parede===a.paredes[i].id),abs=[];
    for(const it of its){const t=TIPOS[it.tipo]||TIPOS.outro;if(t.ab&&it.tipo!=='viga')abs.push({...aberturaDim(it,H),cor:t.cor});
      else if(!t.ab)pontos.push({w:i,p:P3(w,+it.dist||0,6,+it.alt||300),cor:t.cor,l:t.n[0]})}
    faces.push({w,i,L:w.L,H,abs,viga:its.filter(x=>x.tipo==='viga').map(x=>aberturaDim(x,H))})});
  (a.moveis||[]).forEach((m,mi)=>{const i=a.paredes.findIndex(w=>w.id===m.parede);if(i<0||!m.larg||!m.alt||!m.prof)return;
    caixas.push({w:g.ws[i],u0:+m.dist||0,u1:(+m.dist||0)+(+m.larg),n:+m.prof,z0:+m.z||0,z1:(+m.z||0)+(+m.alt),cor:corMovel(m),m,num:mi+1})});
  g.ws.forEach((w,i)=>blocosExtras(a,a.paredes[i].id).forEach(b=>caixas.push({w,u0:b.u0,u1:b.u1,n:b.n1,z0:b.z0,z1:b.z1,cor:b.cS,m:null,tampo:b.t==='tampo'})));
  return {g,H,faces,caixas,pontos}}

// sobra até o fim da parede (para saber onde começa o próximo móvel)

/* ================= COTAS INTERNAS (elevação e planta) ================= */
function _cH(xa,xb,y,txt,cor,fs){const tk=fs*.32;return `<g style="stroke:${cor}"><line x1="${xa-tk}" y1="${y}" x2="${xb+tk}" y2="${y}" stroke-width="1" vector-effect="non-scaling-stroke"/>${[xa,xb].map(x=>`<line x1="${x-tk}" y1="${y+tk}" x2="${x+tk}" y2="${y-tk}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><line x1="${x}" y1="${y-tk*1.5}" x2="${x}" y2="${y+tk*1.5}" stroke-width=".8" vector-effect="non-scaling-stroke"/>`).join('')}</g><text x="${(xa+xb)/2}" y="${y-tk*.9}" font-size="${fs*.58}" text-anchor="middle" style="fill:${cor}" font-weight="600">${txt}</text>`}
function _cV(za,zb,x,txt,cor,fs,lado=-1){const tk=fs*.32,ya=-za,yb=-zb,ym=(ya+yb)/2,tx=x+lado*tk*.9;return `<g style="stroke:${cor}"><line x1="${x}" y1="${ya+tk}" x2="${x}" y2="${yb-tk}" stroke-width="1" vector-effect="non-scaling-stroke"/>${[ya,yb].map(y=>`<line x1="${x-tk}" y1="${y+tk}" x2="${x+tk}" y2="${y-tk}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><line x1="${x-tk*1.5}" y1="${y}" x2="${x+tk*1.5}" y2="${y}" stroke-width=".8" vector-effect="non-scaling-stroke"/>`).join('')}</g><text x="${tx}" y="${ym}" font-size="${fs*.55}" text-anchor="middle" transform="rotate(-90 ${tx} ${ym})" style="fill:${cor}" font-weight="600">${txt}</text>`}
// elevação: corrente das aberturas e pontos em cima, alturas de cada abertura e de cada ponto
function cotasInternasElev(a,wid,L,H,fs,real){const its=a.itens.filter(x=>x.parede===wid);if(!its.length)return '';const fg=real?'#30353a':'var(--fg)';let s='';
  const b=[0,L];its.forEach(it=>{const t=TIPOS[it.tipo]||TIPOS.outro;if(t.ab){const o=aberturaDim(it,H);b.push(o.u0,o.u1)}else b.push(+it.dist||0)});
  const u=[...new Set(b.map(v=>Math.round(Math.max(0,Math.min(L,v)))))].sort((p,q)=>p-q),yc=-H-fs*(real?3.1:2.3);
  for(let k=0;k<u.length-1;k++)if(u[k+1]-u[k]>=1)s+=_cH(u[k],u[k+1],yc,Math.round(u[k+1]-u[k]),fg,fs);
  s+=`<text x="${-fs*.4}" y="${yc+fs*.2}" font-size="${fs*.5}" text-anchor="end" style="fill:${real?'#66716b':'var(--muted)'}">vãos e pontos</text>`;
  its.forEach(it=>{const t=TIPOS[it.tipo]||TIPOS.outro;
    if(t.ab){const o=aberturaDim(it,H),x=Math.min(L-fs*.2,o.u1+fs*.75);
      if(o.z0>1)s+=_cV(0,o.z0,x,(it.tipo==='janela'?'peitoril ':'')+Math.round(o.z0),t.cor,fs,1);
      s+=_cV(o.z0,o.z1,x,Math.round(o.z1-o.z0),t.cor,fs,1);
      if(H-o.z1>1&&it.tipo!=='viga')s+=_cV(o.z1,H,x,Math.round(H-o.z1),t.cor,fs,1)}
    else{const x=+it.dist||0,z=+it.alt||300;s+=`<line x1="${x}" y1="0" x2="${x}" y2="${-z+fs*.5}" style="stroke:${t.cor}" stroke-width="1" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`+_cV(0,z,x-fs*.55,'h '+Math.round(z),t.cor,fs,-1).replace(/<line x1="[^"]*" y1="[^"]*" x2="[^"]*" y2="[^"]*" stroke-width="1" vector-effect="non-scaling-stroke"\/>/,'')}});
  return s}
// planta: corrente das aberturas e móveis por fora de cada parede
function cotasInternasPlanta(a,g,fs,T,real){const fg=real?'#30353a':'var(--fg)';let s='';
  g.ws.forEach((w,i)=>{const pw=a.paredes[i],its=a.itens.filter(x=>x.parede===pw.id),mv=(a.moveis||[]).filter(m=>m.parede===pw.id&&m.larg);if(!its.length&&!mv.length)return;
    const L=w.L,b=[0,L];its.forEach(it=>{const t=TIPOS[it.tipo]||TIPOS.outro;if(t.ab){b.push(+it.dist||0,(+it.dist||0)+(+it.larg||(it.tipo==='janela'?1200:800)))}else b.push(+it.dist||0)});
    const u=[...new Set(b.map(v=>Math.round(Math.max(0,Math.min(L,v)))))].sort((p,q)=>p-q);if(u.length<=2&&!mv.length)return;
    const off=-(T+fs*1.1),P=(uu,nn)=>[w.ax+w.ux*uu+w.ix*nn,-(w.ay+w.uy*uu+w.iy*nn)],r=rotTxt(w.ux,-w.uy),tk=fs*.3;
    const cad=(lst,nn,cor)=>{let o='';for(let k=0;k<lst.length-1;k++){const d=lst[k+1]-lst[k];if(d<1)continue;const [ax,ay]=P(lst[k],nn),[bx,by]=P(lst[k+1],nn),[mx,my]=P((lst[k]+lst[k+1])/2,nn-fs*.45);
        o+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" style="stroke:${cor}" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="${mx}" y="${my}" font-size="${fs*.5}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${r} ${mx} ${my})" style="fill:${cor}" font-weight="600">${Math.round(d)}</text>`}
      lst.forEach(v=>{const [x1,y1]=P(v,nn-tk),[x2,y2]=P(v,nn+tk);o+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${cor}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`});return o};
    if(u.length>2)s+=cad(u,off,fg);
    if(mv.length){const bm=[0,L];mv.forEach(m=>bm.push(+m.dist||0,(+m.dist||0)+(+m.larg)));const um=[...new Set(bm.map(v=>Math.round(Math.max(0,Math.min(L,v)))))].sort((p,q)=>p-q);
      if(um.length>2)s+=cad(um,off-(u.length>2?fs*1.2:0),real?'#2e7d32':'#3f9a52')}});
  return s}

/* ================= PEÇAS AVULSAS (tampo engrossado, painel) e TAMPONAMENTOS nas vistas ================= */
const AVULSAS={tampo:{n:'Tampo engrossado (30 mm)',cor:'#8d6e63'},painel:{n:'Painel / peça avulsa',cor:'#607d8b'}};

function chapaUtil(){const c=(PRECOS&&PRECOS.chapa)||[2740,1840,10,4];return [c[0]-2*c[2],c[1]-2*c[2]]}
function partesTampo(v){const [uc,ul]=chapaUtil(),C=+v.comp||0,Pf=+v.prof||0;const nc=Math.max(1,Math.ceil(C/uc)),nd=Math.max(1,Math.ceil(Pf/ul));return {nc,nd,cp:C/nc,pp:Pf/nd,uc,ul}}
// peça maior que a chapa: emenda no meio (partes iguais), respeitando 2720 x 1820 úteis (gira se não tiver veio)
function emendar(pc){const [uc,ul]=chapaUtil(),cabe=(c,l)=>(c<=uc&&l<=ul)||(!pc.veio&&c<=ul&&l<=uc);if(cabe(pc.c,pc.l))return [pc];
  let nc=1,nl=1;while(!cabe(pc.c/nc,pc.l/nl)&&nc+nl<20){if(pc.c/nc>=pc.l/nl)nc++;else nl++}
  const out=[],n=nc*nl;for(let i=0;i<nc;i++)for(let j=0;j<nl;j++)out.push({...pc,c:Math.round(pc.c/nc),l:Math.round(pc.l/nl),d:`${pc.d} (parte ${out.length+1}/${n}, emenda)`,
    fita:[j===0?pc.fita[0]:0,j===nl-1?pc.fita[1]:0,i===0?pc.fita[2]:0,i===nc-1?pc.fita[3]:0],emenda:1});return out}
function novaAvulsa(k,wid){const mv=(A.moveis||[]).filter(m=>m.parede===wid&&!ehAereo(m)&&m.larg&&(+m.alt||0)<=1200);

      Object.assign(v,{dist:d0,comp:d1-d0,prof:Math.max(...mv.map(m=>+m.prof||0))+38,z:Math.max(...mv.map(m=>(+m.z||0)+(+m.alt||0)))})}

function avulsaHTML(v,idx){const t=AVULSAS[v.k]||AVULSAS.painel,k='v:'+v.id+':',ch=PRECOS?[...chapasDe('Frente'),...chapasDe('Caixa')]:[];

// peças e insumos de uma peça avulsa (mesmas regras do marcenaria_pecas do FreeCAD)
function pecasAvulsa(v){const out=[],ferr={},mat=v.mat||matPadrao('Frente'),F0=[0,0,0,0];
  const add=(d,c,l,esp,fita)=>out.push({d,papel:'Frente',mat,c:Math.round(c),l:Math.round(l),esp,fita,alt:esp,veio:!!pdv('veio_frente',0)});
  if(v.k==='tampo'){const C=+v.comp||0,Pf=+v.prof||0,e=+v.esp||15,fx=+v.faixa||70,fl=fitasV(v);
    const {nc:np,nd,cp,pp}=partesTampo(v),nt=np*nd;let kt=0;
    const topo=(fl0)=>{for(let k=0;k<np;k++)for(let j=0;j<nd;j++)add(nt>1?`Tampo (parte ${++kt}/${nt}, emenda)`:'Tampo',cp,pp,e,fl0?[j===0?fl0[0]:0,j===nd-1?fl0[1]:0,k===0?fl0[2]:0,k===np-1?fl0[3]:0]:F0)};
    if(v.eng!==false){topo(null);for(let k=0;k<np;k++){add('Engrossado tampo',cp,fx,e,F0);add('Engrossado tampo',cp,fx,e,F0)}add('Engrossado tampo',Pf-2*fx,fx,e,F0);add('Engrossado tampo',Pf-2*fx,fx,e,F0);
      const m=(fl[0]*C+fl[1]*C+fl[2]*Pf+fl[3]*Pf)/1000;if(m)ferr[NOME_FITA35()]=Math.round(m*100)/100}
    else topo(fl)}

function nomeAvulsa(v){return v.k==='tampo'?`${v.nome?v.nome+' - ':''}tampo ${v.eng!==false?'engrossado '+2*(+v.esp||15)+' mm':(+v.esp||15)+' mm'} ${v.comp} × ${v.prof}`:`${v.nome?v.nome+' - ':''}painel ${v.alt} × ${v.larg} × ${v.esp}`}

// blocos extras de cada parede para as vistas: tamponamentos dos móveis e peças avulsas
function blocosExtras(a,wid){const L=[],fr=18,mt=2;
  (a.moveis||[]).forEach(m=>{if(m.parede!==wid||!m.larg||!m.alt||!m.prof)return;const u0=+m.dist||0,u1=u0+(+m.larg),z0=+m.z||0,Ht=+m.alt,b=+m.base||0,ae=ehAereo(m);
    const R=ae?0:(b===1||b===4?100:b>1?70:0),zb=(ae||[0,1,4].includes(b))?z0:z0+R,n1=(+m.prof)+fr+mt,cS=mistura(corMovel(m),'#000000',.15),cR=coresMovel(m).fr;

    if(+m.tamp_topo)L.push({u0:u0-E*fr,u1:u1+D*fr,n0:0,n1,z0:z0+Ht,z1:z0+Ht+fr,cS,cR,t:'tamp'});
    if(+m.tamp_base)L.push({u0:u0-E*fr,u1:u1+D*fr,n0:0,n1,z0:z0-fr,z1:z0,cS,cR,t:'tamp'})});
  (a.avulsas||[]).forEach((v,i)=>{if(v.parede!==wid)return;const t=AVULSAS[v.k]||AVULSAS.painel,cR=corMaterial(v.mat||(PRECOS?matPadrao('Frente'):''),'Frente');
    if(v.k==='tampo'){const e=+v.esp||15,h=v.eng!==false?2*e:e;const pt=partesTampo(v),d0=+v.dist||0;L.push({u0:d0,u1:d0+(+v.comp||0),n0:0,n1:+v.prof||0,z0:+v.z||0,z1:(+v.z||0)+h,cS:t.cor,cR,t:'tampo',rot:'T'+(i+1),eng:v.eng!==false,fx:+v.faixa||70,e,
      emU:Array.from({length:pt.nc-1},(_,k)=>d0+pt.cp*(k+1)),emN:Array.from({length:pt.nd-1},(_,k)=>(+v.prof||0)-pt.pp*(k+1))})}
    else L.push({u0:+v.dist||0,u1:(+v.dist||0)+(+v.larg||0),n0:0,n1:+v.esp||18,z0:+v.z||0,z1:(+v.z||0)+(+v.alt||0),cS:t.cor,cR,t:'painel',rot:'P'+(i+1)})});
  return L}
// planta: contorno dos tamponamentos e das peças avulsas

// elevação: tamponamentos e peças avulsas de frente
function extrasElev(a,wid,fs,real){let s='';const Y=z=>-z;

    if(b.t==='tampo'&&b.eng)s+=`<line x1="${b.u0}" y1="${Y(b.z0+b.e)}" x2="${b.u1}" y2="${Y(b.z0+b.e)}" style="stroke:${real?'#2a2e33':b.cS}" stroke-width=".6" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`;
    (b.emU||[]).forEach(u=>{s+=`<line x1="${u}" y1="${Y(b.z1)-fs*.5}" x2="${u}" y2="${Y(b.z0)+fs*.3}" style="stroke:#c62828" stroke-width="1.6" vector-effect="non-scaling-stroke"/><text x="${u}" y="${Y(b.z1)-fs*.7}" font-size="${fs*.45}" text-anchor="middle" style="fill:#c62828" font-weight="700">emenda</text>`});
    if(b.rot)s+=`<text x="${b.u0+lw/2}" y="${b.t==='tampo'?Y(b.z1)-fs*.35:Y(b.z0+h/2)}" font-size="${fs*.55}" text-anchor="middle" dominant-baseline="${b.t==='tampo'?'auto':'central'}" style="fill:${real?'#3a2e22':b.cS}" font-weight="700">${b.rot} · ${Math.round(lw)}${b.t==='tampo'?' × '+Math.round(b.n1)+' · '+Math.round(h)+' mm':''}</text>`});
  return s}

/* ================= GUARDA-ROUPA (mesmas regras do construir_guarda_roupa da bancada) ================= */
const GR_TIPOS=['guarda_roupa','guarda_roupa_2'];
const ehGR=m=>GR_TIPOS.includes(m.tipo);
const GR_PAD={gr_prat_gav:800,gr_maleiro:450,gr_cabideiro:1,gr_cab_desce:60,gr_calco:15,gr_recuo_gav:20};
const grv=(m,k)=>m[k]===undefined||m[k]===null||m[k]===''?GR_PAD[k]:(typeof m[k]==='boolean'?(m[k]?1:0):+m[k]);
const NOME_TUBO_CAB='Tubo cabideiro oblongo (metro)',NOME_SUP_CAB='Suporte para cabideiro oblongo (par)';
function pecasGR(m){
  const e=pdv('esp',15),ef=pdv('esp_fundo',6),fr=pdv('esp_frente',18),fo=pdv('folga',2),mt=pdv('margem_tamp',2),fc=pdv('folga_corredica',13),fag=pdv('folga_alt_gaveta',40);
  const L=+m.larg||0,At=+m.alt||0,P=+m.prof||0,portas=+m.portas||0,gav=+m.gavetas||0,prats=+m.prats||0,base=+m.base||0;
  const R=alturaBase(m),pl=P-ef,li=L-2*e,mc=m.matCaixa||matPadrao('Caixa'),mf=m.matFrente||matPadrao('Frente'),mfu=matPadrao('Fundo');
  const out=[],extras={},F0=[0,0,0,0],F1=[1,0,0,0],F4=[1,1,1,1],AX={X:0,Y:1,Z:2};let compGav=0;
  const add=(d,papel,dim,cA,lA,fita)=>{const mat=papel==='Frente'?mf:papel==='Fundo'?mfu:mc,c=dim[AX[cA]],l=dim[AX[lA]],esp=dim.find((v,i)=>i!==AX[cA]&&i!==AX[lA]);
    out.push({d,papel,mat,c:Math.round(c),l:Math.round(l),esp,fita,alt:dim[2],veio:papel!=='Fundo'&&!!pdv('veio_'+papel.toLowerCase(),0)})};
  const hm=grv(m,'gr_maleiro')+e,dois=m.tipo==='guarda_roupa_2';
  if(R>0&&(base===1||base===4))add(base===4?'Saia do rodapé':'Rodapé','Frente',[L,base===4?fr:e,R],'X','Z',F1);
  const caixa=(A,tipo)=>{add('Lateral','Caixa',[e,pl,A],'Z','Y',F1);add('Lateral','Caixa',[e,pl,A],'Z','Y',F1);
    add('Base','Caixa',[li,pl,e],'X','Y',F1);add('Topo','Caixa',[li,pl,e],'X','Y',F1);add('Fundo','Fundo',[L,ef,A],'Z','X',F0);
    if(tipo!=='maleiro'){let teto=A-e;const prats_=tipo==='corpo'?((prats>=2||gav)?1:0):prats;
      if(tipo==='inteiro'&&prats_>=1){add('Prateleira fixa do maleiro','Caixa',[li,pl,e],'X','Y',F1);teto=A-grv(m,'gr_maleiro')-e}
      const temPG=gav>0||prats_>=(tipo==='inteiro'?2:1);let zg=null;
      if(temPG){zg=Math.max(e+150,grv(m,'gr_prat_gav')-R-e);add('Prateleira fixa do gaveteiro','Caixa',[li,pl,e],'X','Y',F1)}
      const nExt=prats_-(tipo==='inteiro'?2:1);if(nExt>0&&!gav&&zg!==null)for(let i=0;i<nExt;i++)add('Prateleira','Caixa',[li,pl-20,e],'X','Y',F1);
      if(grv(m,'gr_cabideiro')){extras[NOME_TUBO_CAB]=(extras[NOME_TUBO_CAB]||0)+Math.round((li-4)/10)/100;extras[NOME_SUP_CAB]=(extras[NOME_SUP_CAB]||0)+1}
      if(gav&&zg!==null){const gc=grv(m,'gr_calco'),rec=grv(m,'gr_recuo_gav'),hreg=zg-e;
        add('Calço do gaveteiro','Caixa',[gc,pl-60,hreg],'Z','Y',F1);add('Calço do gaveteiro','Caixa',[gc,pl-60,hreg],'Z','Y',F1);
        const wi=li-2*gc,hg=(hreg-(gav+1)*fo)/gav,livre=pl-rec-e-10,CR=[250,300,350,400,450,500,550,600],ok=CR.filter(c=>c<=livre),cr=ok.length?Math.max(...ok):CR[0],hc=hg-fag,lx=wi-2*fc;compGav=cr;
        for(let k=0;k<gav;k++){add('Frente de gaveta interna','Caixa',[wi-2*fo,e,hg],'X','Z',F4);
          add('Lateral da Gaveta','Caixa',[e,cr,hc],'Y','Z',F0);add('Lateral da Gaveta','Caixa',[e,cr,hc],'Y','Z',F0);
          add('Frente/Trás da Gaveta','Caixa',[lx-2*e,e,hc],'X','Z',F0);add('Frente/Trás da Gaveta','Caixa',[lx-2*e,e,hc],'X','Z',F0);
          add('Fundo da Gaveta','Fundo',[lx,cr,ef],'X','Y',F0)}}}
    if(portas){const wp=(L-(portas+1)*fo)/portas;for(let i=0;i<portas;i++)add('Porta','Frente',[wp,fr,A-2*fo],'Z','X',F4)}};
  if(dois){caixa(At-hm-R,'corpo');caixa(hm,'maleiro')}else caixa(At-R,'inteiro');
  const tw=P+fr+mt,hT=[0,1,4].includes(base)?At:At-R;
  if(+m.tamp_esq)add('Tamponamento','Frente',[fr,tw,hT],'Z','Y',F4);
  if(+m.tamp_dir)add('Tamponamento','Frente',[fr,tw,hT],'Z','Y',F4);
  const lT=L+(+m.tamp_esq?fr:0)+(+m.tamp_dir?fr:0);if(+m.tamp_topo)add('Tamponamento topo','Frente',[lT,tw,fr],'X','Y',F4);
  return {pecas:out.filter(p=>p.c>0&&p.l>0),compGav,aprox:false,extras,caixas:dois?2:1}}
function grCampos(m){return `<div class="ig">
    <div><label>Prateleira do gaveteiro (do chão)</label>${inp('m','gr_prat_gav',grv(m,'gr_prat_gav'),'m:'+m.id+':gr_prat_gav',m.id)}</div>
    <div><label>Altura do maleiro (do topo)</label>${inp('m','gr_maleiro',grv(m,'gr_maleiro'),'m:'+m.id+':gr_maleiro',m.id)}</div></div>
  <div class="row wrap"><label class="chk"><input type="checkbox" data-o="m" data-id="${m.id}" data-f="gr_cabideiro" data-t="b"${grv(m,'gr_cabideiro')?' checked':''}> Cabideiro (tubo oblongo)</label>
    <span class="meta">Gavetas = gaveteiro interno, atrás das portas. Prateleiras: 1 = só maleiro, 2 = maleiro + gaveteiro. Altura máxima 2700.</span></div>`}

/* ================= eventos ================= */
function obj(o,id){if(o==='c')return cantoTmp;if(o==='p')return P;if(o==='a')return A;if(o==='w')return A.paredes.find(w=>w.id===id);if(o==='i')return A.itens.find(i=>i.id===id);if(o==='m')return (A.moveis||[]).find(m=>m.id===id);if(o==='v')return (A.avulsas||[]).find(v=>v.id===id)}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');
  if(!e.target.closest('#menu')&&!e.target.closest('#menuBtn'))$('#menu').hidden=true;
  if(!b)return;const a=b.dataset.a,id=b.dataset.id,f=b.dataset.f;
  switch(a){
    case 'novoProj':P={id:uid(),cliente:'',endereco:'',obs:'',criado:Date.now(),ambientes:[]};projetos.push(P);await dbPut('projetos',P);view='projeto';render();setTimeout(()=>$('#pc')&&$('#pc').focus(),60);break;
    case 'abrirProj':P=projetos.find(p=>p.id===id);A=null;view='projeto';render();scrollTo(0,0);break;
    case 'abrirAmb':A=P.ambientes.find(x=>x.id===id);selW=null;alvoKey=A.peDireito?null:'pd';view='amb';render();scrollTo(0,0);break;
    case 'novoAmb':{const angs=f==='L'?[90,90,270,90,90,90]:f==='1'?[90]:[90,90,90,90];
      A={id:uid(),nome:'Ambiente '+(P.ambientes.length+1),peDireito:null,paredes:angs.map(v=>({id:uid(),L:null,ang:v})),itens:[],moveis:[],fotos:[],obs:'',diag1:null,diag2:null};
      P.ambientes.push(A);salvar();selW=null;alvoKey='pd';view='amb';render();scrollTo(0,0);toast('Dê um nome ao ambiente e meça o pé-direito');break;}
    case 'addW':{const w={id:uid(),L:null,ang:90};A.paredes.push(w);salvar();selW=w.id;alvoKey='w:'+w.id;render();break;}
    case 'delW':if(!dupla(b))return;{const w=A.paredes.find(x=>x.id===id);for(const fo of [...(w&&w.fotos||[]),...A.itens.filter(i=>i.parede===id).flatMap(i=>i.fotos)])dbDel('fotos',fo).catch(()=>{});}A.itens=A.itens.filter(i=>i.parede!==id);A.paredes=A.paredes.filter(w=>w.id!==id);salvar();render();break;
    case 'selW':selecionarParede(id);break;
    case 'addI':{if(!A.paredes.length){toast('Adicione uma parede primeiro');return}
      const w=selW||A.paredes[0].id,it={id:uid(),tipo:f,parede:w,dist:null,alt:(f==='porta'||f==='vao')?0:null,larg:null,h:null,obs:'',fotos:[]};
      A.itens.push(it);salvar();alvoKey='i:'+it.id+':dist';render();
      const el=document.querySelector(`[data-k="${CSS.escape(alvoKey)}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
      toast(`${TIPOS[f].n} na parede ${letra(w)} — meça a distância`);break;}
    case 'addM':{if(!A.paredes.length){toast('Adicione uma parede primeiro');return}
      const w=selW||A.paredes[0].id,pr=MOVEIS[f];if(!A.moveis)A.moveis=[];
      const mesmo=A.moveis.filter(x=>x.parede===w&&ehAereo(x)===ehAereo(pr));
      const dist=mesmo.reduce((mx,x)=>Math.max(mx,(+x.dist||0)+(+x.larg||0)+(+x.tamp_dir?18:0)),0);
      const m={id:uid(),k:f,tipo:pr.tipo,parede:w,dist,larg:pr.larg,alt:pr.alt,prof:pr.prof,z:pr.z,portas:pr.portas,gavetas:pr.gavetas,prats:pr.prats,base:pr.base,nome:''};
      A.moveis.push(m);salvar();alvoKey='m:'+m.id+':larg';render();
      const el=document.querySelector(`[data-k="${CSS.escape(alvoKey)}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
      toast(`${pr.n} na parede ${letra(w)}, a ${dist} mm do início`);break;}
    case 'addV':{if(!A.paredes.length){toast('Adicione uma parede primeiro');return}if(!A.avulsas)A.avulsas=[];
      const v=novaAvulsa(f,selW||A.paredes[0].id);A.avulsas.push(v);salvar();render();
      const el=document.querySelector(`[data-k="v:${v.id}:comp"],[data-k="v:${v.id}:larg"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
      toast(f==='tampo'?`Tampo ${v.comp} × ${v.prof} na parede ${letra(v.parede)}`:'Painel na parede '+letra(v.parede));break;}
    case 'delV':if(!dupla(b))return;A.avulsas=(A.avulsas||[]).filter(v=>v.id!==id);salvar();render();break;
    case 'tampoMoveis':{const v=(A.avulsas||[]).find(x=>x.id===id);if(!v)return;const n=novaAvulsa('tampo',v.parede);
      if(!(A.moveis||[]).some(m=>m.parede===v.parede&&!ehAereo(m)&&(+m.alt||0)<=1200)){toast('Não há balcões nessa parede');return}
      Object.assign(v,{dist:n.dist,comp:n.comp,prof:n.prof,z:n.z});salvar();render();toast(`Tampo ${v.comp} × ${v.prof}, a ${v.dist} mm do início`);break;}
    case 'delM':if(!dupla(b))return;A.moveis=(A.moveis||[]).filter(m=>m.id!==id);salvar();render();break;
    case 'delI':if(!dupla(b))return;{const it=A.itens.find(i=>i.id===id);if(it)for(const fo of it.fotos)dbDel('fotos',fo).catch(()=>{});}
      A.itens=A.itens.filter(i=>i.id!==id);salvar();render();break;
    case 'delAmb':if(!dupla(b))return;for(const fo of fotosAmb(A))dbDel('fotos',fo).catch(()=>{});
      P.ambientes=P.ambientes.filter(x=>x!==A);A=null;salvar();view='projeto';render();break;
    case 'delProj':if(!dupla(b))return;for(const fo of P.ambientes.flatMap(fotosAmb))dbDel('fotos',fo).catch(()=>{});
      await dbDel('projetos',P.id);projetos=projetos.filter(p=>p!==P);P=null;view='lista';render();break;
    case 'exp':exportar(f);break;
    case 'vista':vista=f;document.querySelectorAll('.abas button').forEach(x=>{x.classList.toggle('on',x.dataset.f===f)});{const el=$('#plan');el.innerHTML=vistaHTML(geo(A));if(f==='3d')ligar3D()}break;
    case 'estilo':estilo=f;try{localStorage.setItem('glm_estilo2',f)}catch(e){}{const el=$('#plan');el.innerHTML=vistaHTML(geo(A));if(vista==='3d')ligar3D()}break;
    case 'cam':camPreset(f);{const el=$('#plan');el.innerHTML=vistaHTML(geo(A));ligar3D()}break;
    case 'novoAmbTela':novoNome='';desenho=null;view='modelo';render();scrollTo(0,0);break;
    case 'nomeAmb':novoNome=f;render();break;
    case 'usarModelo':{const m=MODELOS.find(x=>x.k===f);if($('#novoNome'))novoNome=$('#novoNome').value.trim()||novoNome;criarAmbiente(m.Lp,m.ang,0);break;}
    case 'desenhar':if($('#novoNome'))novoNome=$('#novoNome').value.trim()||novoNome;desenho=null;view='desenho';render();scrollTo(0,0);break;
    case 'desenhoLimpar':desenho=null;render();break;
    case 'desenhoVoltar':desenho=null;view='modelo';render();break;
    case 'desenhoUsar':if(desenho&&desenho.res){const r=desenho.res;criarAmbiente(r.Lp,r.ang,r.giro)}break;
    case 'abrirOrc':view='orc';render();scrollTo(0,0);break;
    case 'carregarPrecos':$('#precoFile').click();break;
    case 'orcCli':if(ORC)await entregar(slug(P.cliente)+'_orcamento.html',new Blob([orcClienteHTML()],{type:'text/html'}));break;
    case 'orcXlsx':if(ORC)try{await orcExcel()}catch(er){toast('Erro no Excel: '+er.message,4000)}break;
    case 'orcLeo':if(ORC)await entregar(slug(P.cliente)+'_Leo.csv',new Blob([orcLeo()],{type:'text/csv'}));break;
    case 'bkOne':backupOneDrive(b);break;
    case 'importar':$('#impFile').click();break;
    case 'verFoto':verFoto(id,b.dataset.dono);break;
    case 'mTodos':conectar(true);break;
    case 'mDesc':if(device&&device.gatt.connected){device.gatt.disconnect();toast('Trena desconectada')}break;
    case 'mDiag':if(view!=='diag'&&view!=='ajuda')prevView=view;view='diag';render();break;
    case 'mAjuda':if(view!=='diag'&&view!=='ajuda')prevView=view;view='ajuda';render();break;
    case 'copLog':try{await navigator.clipboard.writeText(logLines.join('\n'));toast('Diagnóstico copiado')}catch(_){toast('Não consegui copiar')}break;
    case 'ficha':fichaAberta=fichaAberta===id?null:id;cantoAberto=null;selW=id;render();break;
    case 'fichaFechar':fichaAberta=null;render();break;
    case 'canto':fichaAberta=null;cantoAberto=cantoAberto===id?null:id;cantoTmp={};selW=id;alvoKey=cantoAberto?'c:'+id+':a':alvoKey;render();break;
    case 'cantoFechar':cantoAberto=null;render();break;
    case 'cantoFixo':{const w=A.paredes.find(x=>x.id===id);if(w){w.ang=+f;salvar()}cantoAberto=null;render();break;}
    case 'cantoUsar':{const g=anguloCanto(cantoTmp),w=A.paredes.find(x=>x.id===id);if(g==null||isNaN(g)){toast('Meça as duas marcas e a diagonal');return}
      w.ang=g;salvar();cantoAberto=null;render();toast('Canto ajustado para '+fmtAng(g)+'°');break;}
    case 'simular':leitura(1000+Math.round(Math.random()*3000));break;
  }
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='prefShare'){prefShare=el.checked;ls.set('glm_share',prefShare?'1':'0');return}
  if(el.id==='impFile'){await importar(el.files[0]);el.value='';return}
  if(el.dataset.sobra){const o=el.dataset.sobra,obj=o==='i'?A.itens.find(x=>x.id===el.dataset.id):(A.moveis||[]).find(x=>x.id===el.dataset.id);if(!obj)return;
    const w=A.paredes.find(x=>x.id===obj.parede),v=el.value.trim()===''?null:Math.round(num(el.value));
    if(!w||!w.L){toast('Meça a parede primeiro para usar a sobra');el.value='';return}
    if(v!=null){const t=o==='i'?TIPOS[obj.tipo]||TIPOS.outro:null,larg=o==='m'||t.ab?(+obj.larg||0):0;
      if((o==='m'||t.ab)&&!larg){toast('Preencha a largura antes');return}
      obj.dist=Math.round(w.L-v-larg);salvar();const di=document.querySelector(`input[data-o="${o}"][data-id="${obj.id}"][data-f="dist"]`);if(di)di.value=obj.dist;parcial();toast('Distância do início: '+obj.dist+' mm')}return}
  if(el.id==='precoFile'){await importarPrecos(el.files[0]);el.value='';return}
  if(el.dataset.o==='orc'){if(!P.orc)P.orc={params:{},extras:[]};const v=el.value.trim();if(v==='')delete P.orc.params[el.dataset.f];else P.orc.params[el.dataset.f]=num(v);salvar();render();return}
  if(el.dataset.o==='mcor'){const m=P.ambientes.flatMap(a=>[...(a.moveis||[]),...(a.avulsas||[])]).find(x=>x.id===el.dataset.id);if(m){m[el.dataset.f]=el.value;salvar();render()}return}
  if(el.dataset.fotoO){const files=[...el.files];el.value='';
    const dono=el.dataset.fotoO==='a'?A:el.dataset.fotoO==='w'?A.paredes.find(w=>w.id===el.dataset.id):A.itens.find(i=>i.id===el.dataset.id);if(!dono)return;if(!dono.fotos)dono.fotos=[];
    let ultId=null;for(const file of files){try{const blob=await comprimir(file),id=uid();await dbPut('fotos',{id,blob});dono.fotos.push(id);ultId=id}catch(err){toast('Não consegui salvar a foto: '+err.message,4000)}}
    salvar();render();if(ultId&&files.length===1)abrirEditor(ultId);else toast('Foto salva');return}
  const o=el.dataset.o;if(!o)return;const t=obj(o,el.dataset.id);if(!t)return;
  let v=el.value;if(el.dataset.t==='b')v=el.checked;else if(el.dataset.t==='n'){v=v.trim()===''?null:num(v);if(v!=null)v=Math.round(v)}
  t[el.dataset.f]=v;salvar();
  if(o==='m'&&el.dataset.f==='k'&&MOVEIS[v]){const pr=MOVEIS[v];Object.assign(t,{tipo:pr.tipo,larg:pr.larg,alt:pr.alt,prof:pr.prof,z:pr.z,portas:pr.portas,gavetas:pr.gavetas,prats:pr.prats,base:pr.base});salvar()}
  if(el.dataset.full)render();else if(view==='amb')parcial();
  if(view==='amb'&&o==='w')atualizarSobras();else if(o==='p')titulo(P.cliente||'Novo projeto',P.endereco||'Projeto');
});
