<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Medidor GLM</title>
<style>
/* Layout: barra fixa com status da trena; em tablet deitado, planta à esquerda e formulário à direita */
:root{
  --bg:#f2f1ec; --panel:#ffffff; --fg:#1b2621; --muted:#66716b; --line:#d8d5cb;
  --accent:#0f6b4f; --accent-fg:#fff; --laser:#c8321e; --warn:#a86a00; --ok:#1f7a3f;
  --room:#e4ede7; --top:#14201b; --top-fg:#eef3f0;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101614; --panel:#18211d; --fg:#e4ebe7; --muted:#90a098; --line:#2b3732;
  --accent:#3bb88a; --accent-fg:#08110d; --laser:#ff6a52; --warn:#e3a640; --ok:#5ccf86;
  --room:#1f2d27; --top:#0b100e; --top-fg:#e4ebe7; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--top-fg);display:flex;align-items:center;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
.top .tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.top .tt b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{color:#9fb0a8;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ult{font:600 1.05rem var(--mono);font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:8px;background:#ffffff14;white-space:nowrap}
.ult.flash{background:var(--laser);color:#fff}
.ic{background:transparent;border:0;color:inherit;font-size:1.3rem;min-width:44px;min-height:44px;border-radius:8px;cursor:pointer}
.btchip{display:flex;align-items:center;gap:6px;background:#ffffff14;color:var(--top-fg);border:0;border-radius:999px;padding:8px 12px;font:600 .85rem var(--body);min-height:40px;cursor:pointer}
.btchip .dot{width:10px;height:10px;border-radius:50%;background:#7c8a84}
.btchip.on .dot{background:#3bdc8f;box-shadow:0 0 0 3px #3bdc8f40}
.btchip.busy .dot{background:#e3a640}
main{max-width:1280px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{font-size:1.25rem;margin:0}
h3{font-size:1.02rem;margin:0}
label{display:block;font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:1.05rem var(--body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);min-height:48px}
textarea{resize:vertical}
input.laser{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
input.alvo{border-color:var(--laser);box-shadow:0 0 0 3px color-mix(in srgb,var(--laser) 30%,transparent);background:color-mix(in srgb,var(--laser) 6%,var(--panel))}
button,.btn{font:600 .95rem var(--body);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--laser);border-color:color-mix(in srgb,var(--laser) 40%,var(--line))}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:3px solid var(--laser);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:96px}
.card b{font-size:1.05rem}
.meta{color:var(--muted);font-size:.85rem;font-weight:400}
.pill{font:600 .75rem var(--body);padding:3px 9px;border-radius:999px;margin-top:4px}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:20px;max-width:60ch}
.vazio p{margin:.3em 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.lbl{font-weight:600;color:var(--muted)}
.exp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.exp button{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px}
.exp button span{font-weight:400;font-size:.85rem;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font:400 .9rem var(--body);color:var(--fg)}
.chk input{width:22px;min-height:22px;height:22px}
/* ambiente */
.amb{display:grid;gap:16px}
@media (min-width:900px){.amb{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.col-plan{position:sticky;top:76px;align-self:start}}
.col-plan{display:flex;flex-direction:column;gap:10px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.svgplan{width:100%;height:auto;max-height:58vh;display:block;touch-action:manipulation}
@media (max-width:899px){.svgplan{max-height:42vh}}
.pend{background:color-mix(in srgb,var(--warn) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:10px;padding:10px 14px}
.pend.ok{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.pend ul{margin:6px 0 0;padding-left:20px}
.dica{margin:0;color:var(--muted);font-size:.88rem}
.walls{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:36px minmax(0,1fr) 88px 60px 40px;gap:8px;align-items:end;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.wrow.sel{border-color:var(--laser)}
.wrow .lt{font:700 1.4rem var(--mono);text-align:center;align-self:center}
.wrow.sel .lt{color:var(--laser)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{min-height:40px;padding:6px 10px;font-size:.85rem}
.quick i{width:10px;height:10px;border-radius:50%;display:inline-block}
.itens{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:8px}
.ih{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px;gap:8px}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--room)}
.menu{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(60px + env(safe-area-inset-top));z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:240px;box-shadow:0 10px 30px #0004}
.menu button{border:0;justify-content:flex-start;background:transparent}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab button{box-shadow:0 6px 18px #0005}
.fab #fabLaser{min-height:44px;font-size:.85rem}
.fab #fabLaser.on{background:var(--laser);color:#fff;border-color:var(--laser)}
.fabm{width:96px;height:96px;border-radius:50%;background:var(--laser);color:#fff;border:0;font:800 1.15rem var(--body);letter-spacing:.04em}
.fabm:disabled{opacity:.7}
main{padding-bottom:140px!important}
.canto{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.canto .res{font:700 1.3rem var(--mono)}
.angb{min-height:48px;width:100%;font-family:var(--mono)}
.editor{position:fixed;inset:0;z-index:60;background:#0b0f0d;color:#eef3f0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.editor button{background:#1f2a25;color:#eef3f0;border-color:#33433b}
.editor button.primary{background:#3bb88a;color:#08110d;border-color:#3bb88a}
.edtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button[aria-pressed="true"]{background:#eef3f0;color:#0b0f0d}
.cores{display:flex;gap:8px}
.cores button{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;background:var(--k);border:3px solid #33433b}
.cores button[aria-pressed="true"]{border-color:#eef3f0;outline:2px solid #0b0f0d}
.edwrap{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:4px}
#edc{touch-action:none;max-width:100%;max-height:100%;border-radius:4px}
.edbar{min-height:72px;padding:10px max(140px,env(safe-area-inset-right)) 10px 12px;background:#141c18;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#cfdad4}
.edbar input{background:#0b0f0d;color:#eef3f0;border-color:#33433b;max-width:260px}
.edbar input.alvo{border-color:#ff5a3c;box-shadow:0 0 0 3px #ff5a3c55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));z-index:40;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;max-width:min(92vw,560px);text-align:center}
.viewer{position:fixed;inset:0;z-index:50;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.viewer img{max-width:100%;max-height:80vh;border-radius:8px}
pre{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:50vh;overflow:auto}
.ajuda h3{margin-top:10px}
.ajuda p,.ajuda li{max-width:70ch}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <button id="voltar" class="ic" aria-label="Voltar" hidden>←</button>
  <div class="tt"><b id="titulo">Medidor GLM</b><small id="sub"></small></div>
  <div class="ult" id="ult" title="Última leitura da trena">— mm</div>
  <button id="bt" class="btchip"><span class="dot"></span><span id="btTxt">Conectar trena</span></button>
  <button id="menuBtn" class="ic" aria-label="Menu">⋮</button>
</header>
<div id="menu" class="menu" hidden>
  <button data-a="mTodos">Procurar todos os aparelhos</button>
  <button data-a="mDesc">Desconectar trena</button>
  <button data-a="mAjuda">Como usar e exportar</button>
  <button data-a="mDiag">Diagnóstico do Bluetooth</button>
</div>
<main id="main"></main>
<input type="file" id="impFile" accept=".json,application/json" hidden>
<div id="fab" class="fab" hidden>
  <button id="fabLaser" type="button">Ligar laser (mirar)</button>
  <button id="fabMedir" type="button" class="fabm">MEDIR</button>
</div>
<div id="toast" class="toast" hidden></div>
<div id="viewer" class="viewer" hidden>
  <img id="vimg" alt="Foto">
  <div class="row wrap"><button id="vedit">✏️ Anotar medidas</button><button id="vdel" class="danger">Apagar foto</button><button id="vclose" class="primary">Fechar</button></div>
</div>
<div id="editor" class="editor" hidden>
  <div class="edtop">
    <div class="tools" id="edTools" role="toolbar" aria-label="Ferramentas">
      <button data-t="cota">↔ Cota</button><button data-t="seta">↗ Seta</button><button data-t="texto">T Nota</button><button data-t="mover">✋ Mover</button>
    </div>
    <div class="cores" id="edCores" aria-label="Cor">
      <button data-c="#ffd400" style="--k:#ffd400" aria-label="Amarelo"></button><button data-c="#ff3b2f" style="--k:#ff3b2f" aria-label="Vermelho"></button><button data-c="#2fd3ff" style="--k:#2fd3ff" aria-label="Azul"></button><button data-c="#ffffff" style="--k:#ffffff" aria-label="Branco"></button>
    </div>
    <div class="row"><button id="edUndo">Desfazer</button><button id="edCancel">Cancelar</button><button id="edSave" class="primary">Salvar</button></div>
  </div>
  <div class="edwrap" id="edWrap"><canvas id="edc"></canvas></div>
  <div class="edbar" id="edBar"></div>
</div>

<script>
'use strict';
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null};
const LETRAS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const asc=t=>String(t??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,'');
const slug=t=>asc(t).trim().replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'projeto';
let tT;function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,ms)}
function dupla(b){if(b.dataset.c){delete b.dataset.c;return true}const o=b.textContent;b.dataset.c=1;b.textContent='Toque de novo para confirmar';setTimeout(()=>{if(b.dataset.c){delete b.dataset.c;b.textContent=o}},3000);return false}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const TIPOS={
  porta:{n:'Porta',ab:1,cor:'#b8682c'},
  janela:{n:'Janela',ab:1,cor:'#2c80b8'},
  vao:{n:'Vão / passagem',ab:1,cor:'#7d8a84'},
  viga:{n:'Viga / pilar',ab:1,cor:'#8b4fb0'},
  tomada:{n:'Tomada',cor:'#d69a00'},
  interruptor:{n:'Interruptor',cor:'#c97f00'},
  luz:{n:'Ponto de luz',cor:'#e0b400'},
  agua:{n:'Água',cor:'#1d8fd6'},
  esgoto:{n:'Esgoto',cor:'#7a5230'},
  gas:{n:'Gás',cor:'#d6451d'},
  ar:{n:'Ar-condicionado',cor:'#17a594'},
  outro:{n:'Outro',cor:'#6b6b6b'}
};

/* ================= banco local (IndexedDB) ================= */
let db;
function abrirDB(){return new Promise((res,rej)=>{const r=indexedDB.open('medidor',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projetos',{keyPath:'id'});d.createObjectStore('fotos',{keyPath:'id'})};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const dbAll=s=>tx(s,'readonly',st=>st.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const dbGet=(s,k)=>tx(s,'readonly',st=>st.get(k));
const dbDel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));

/* ================= estado ================= */
let projetos=[],P=null,A=null,view='lista',prevView='lista',selW=null,alvoKey=null;
let prefShare=ls.get('glm_share')==='1';
let tS;function salvar(){clearTimeout(tS);const p=P;tS=setTimeout(()=>{if(p)dbPut('projetos',p).catch(e=>toast('Erro ao salvar: '+e.message))},250)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&P){clearTimeout(tS);dbPut('projetos',P).catch(()=>{})}});
function guardarNav(){ls.set('glm_nav',JSON.stringify({view,p:P&&P.id,a:A&&A.id}))}
const letra=(id,a=A)=>{const i=a?a.paredes.findIndex(w=>w.id===id):-1;return i<0?'?':LETRAS[i]};

/* ================= geometria ================= */
// Paredes em sequência, andando para a DIREITA (sentido horário visto de cima).
// "ang" = ângulo interno do canto no FIM da parede (90 normal, 270 canto para dentro).
function geo(a){
  let x=0,y=0,d=0;const pts=[{x,y}],ws=[];
  a.paredes.forEach(w=>{const L=w.L||1000;const ux=Math.cos(d),uy=Math.sin(d);
    ws.push({ax:x,ay:y,bx:x+L*ux,by:y+L*uy,ux,uy,L,ok:!!w.L});x+=L*ux;y+=L*uy;pts.push({x,y});
    d-=(180-(+w.ang||90))*Math.PI/180;});
  let ar=0;for(let i=0;i<pts.length-1;i++)ar+=pts[i].x*pts[i+1].y-pts[i+1].x*pts[i].y;
  const ccw=ar>0;
  ws.forEach(w=>{const lx=-w.uy,ly=w.ux;w.esq=!ccw;w.ix=ccw?lx:-lx;w.iy=ccw?ly:-ly;w.ox=-w.ix;w.oy=-w.iy});
  const fech=ws.length>=3?Math.hypot(x,y):null;
  const fechado=fech!=null&&fech<20&&a.paredes.every(w=>w.L);
  return {pts,ws,fech,fechado};
}
const fotosAmb=a=>[...a.fotos,...a.paredes.flatMap(w=>w.fotos||[]),...a.itens.flatMap(i=>i.fotos)];
const rotTxt=(ux,uy)=>{let r=Math.atan2(uy,ux)*180/Math.PI;if(r>90)r-=180;if(r<=-90)r+=180;return r};

/* ================= pendências ================= */
function pendencias(a){
  const r=[];if(!a.peDireito)r.push('Medir o pé-direito');
  a.paredes.forEach((w,i)=>{if(!w.L)r.push('Medir a parede '+LETRAS[i])});
  const g=geo(a);
  if(g.fech!=null&&a.paredes.every(w=>w.L)&&g.fech>20)r.push(`A planta não fecha por ${Math.round(g.fech)} mm — confira as medidas e os cantos`);
  a.itens.forEach(it=>{const t=TIPOS[it.tipo]||TIPOS.outro;const n=`${t.n} (parede ${letra(it.parede,a)})`;
    if(it.dist==null)r.push(n+': falta a distância');
    if(it.alt==null)r.push(n+': falta a altura do piso');
    if(t.ab&&(!it.larg||!it.h))r.push(n+': falta largura ou altura')});
  if(!a.fotos.length)r.push('Tirar ao menos uma foto do ambiente');
  return r;
}
function pendHTML(pe){return pe.length?`<div class="pend"><b>Falta (${pe.length})</b><ul>${pe.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:`<div class="pend ok"><b>Ambiente completo.</b> Tudo medido e fotografado.</div>`}

/* ================= planta (SVG) ================= */
function planSVG(a,g,opt={}){
  const xs=g.pts.map(p=>p.x),ys=g.pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const span=Math.max(x1-x0,y1-y0,1500),pad=span*.16,fs=span/26;
  x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  let s=`<svg class="svgplan" viewBox="${x0.toFixed(0)} ${(-y1).toFixed(0)} ${(x1-x0).toFixed(0)} ${(y1-y0).toFixed(0)}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" role="img" aria-label="Planta do ambiente">`;
  if(g.fechado)s+=`<polygon points="${g.pts.slice(0,-1).map(p=>p.x.toFixed(1)+','+(-p.y).toFixed(1)).join(' ')}" style="fill:var(--room)"/>`;
  g.ws.forEach((w,i)=>{const id=a.paredes[i].id,sel=opt.sel===id,miss=!w.ok;
    s+=`<line x1="${w.ax}" y1="${-w.ay}" x2="${w.bx}" y2="${-w.by}" style="stroke:${sel?'var(--laser)':'var(--fg)'};stroke-width:${sel?6:4}px;${miss?'stroke-dasharray:9 7;':''}" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`;
    s+=`<line x1="${w.ax}" y1="${-w.ay}" x2="${w.bx}" y2="${-w.by}" stroke="transparent" stroke-width="${fs*1.8}" data-a="selW" data-id="${id}" style="cursor:pointer"/>`;
    const mx=(w.ax+w.bx)/2+w.ix*fs*1.5,my=-((w.ay+w.by)/2+w.iy*fs*1.5),r=rotTxt(w.ux,-w.uy);
    s+=`<text x="${mx}" y="${my}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${r} ${mx} ${my})" style="fill:${miss?'var(--warn)':(sel?'var(--laser)':'var(--fg)')};font-weight:700" data-a="selW" data-id="${id}">${LETRAS[i]} · ${miss?'?':Math.round(w.L)}</text>`;
  });
  if(g.ws.length){const w=g.ws[0];s+=`<circle cx="${w.ax}" cy="${-w.ay}" r="${fs*.32}" style="fill:var(--accent)"/>`}
  a.itens.forEach(it=>{const i=a.paredes.findIndex(w=>w.id===it.parede);if(i<0)return;const w=g.ws[i],t=TIPOS[it.tipo]||TIPOS.outro,d=it.dist||0;
    if(t.ab){const d2=d+(it.larg||500),o=fs*.22;
      s+=`<line x1="${w.ax+w.ux*d+w.ix*o}" y1="${-(w.ay+w.uy*d+w.iy*o)}" x2="${w.ax+w.ux*d2+w.ix*o}" y2="${-(w.ay+w.uy*d2+w.iy*o)}" stroke="${t.cor}" stroke-width="9" vector-effect="non-scaling-stroke"/>`;
    }else{const cx=w.ax+w.ux*d+w.ix*fs*.75,cy=-(w.ay+w.uy*d+w.iy*fs*.75);
      s+=`<circle cx="${cx}" cy="${cy}" r="${fs*.45}" fill="${t.cor}"/><text x="${cx}" y="${cy}" font-size="${fs*.55}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700">${esc(t.n[0])}</text>`;}
  });
  return s+'</svg>';
}

function difTxt(m,c){if(!c||!m)return '';const d=Math.round(m-c);return `${Math.abs(d)<=5?'✓ no esquadro':'⚠ fora de esquadro'} · calculada ${Math.round(c)} · dif. ${d>0?'+':''}${d} mm`}
function diagCalc(g){if(g.pts.length<5)return [null,null];const p=g.pts;return [Math.hypot(p[2].x-p[0].x,p[2].y-p[0].y),Math.hypot(p[3].x-p[1].x,p[3].y-p[1].y)]}

const fmtAng=v=>{const n=+v||90;return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',')};

  <div class="row wrap">${fotoBtn('w',w.id)}<span class="meta">${fs.length?fs.length+' foto(s). Toque para ver ou anotar.':'A foto abre no editor para você marcar as cotas.'}</span></div>
  ${fs.length?`<div class="thumbs">${fs.map(f=>`<img data-foto="${f}" data-a="verFoto" data-id="${f}" data-dono="w:${w.id}" alt="Foto da parede ${LETRAS[i]}">`).join('')}</div>`:''}
  <div><button data-a="fichaFechar">Fechar</button></div></div>`}
function anguloCanto(t){const a=t.a,b=t.b,c=t.c;if(!a||!b||!c)return null;const k=(a*a+b*b-c*c)/(2*a*b);if(k<-1||k>1)return NaN;
  let g=Math.acos(k)*180/Math.PI;if(t.quina)g=360-g;return Math.round(g*10)/10}
function cantoHTML(w,i){const t=cantoTmp,prox=LETRAS[(i+1)%A.paredes.length],g=anguloCanto(t),k='c:'+w.id+':';
  return `<div class="canto">

  <p class="dica">Regra do 3-4-5: marque um ponto na parede ${LETRAS[i]} e outro na ${prox}, a partir do canto (ex.: 1000 mm cada). Meça as duas distâncias e a diagonal entre as marcas.</p>
  <div class="ig">
    <div><label>Marca na parede ${LETRAS[i]}</label>${inp('c','a',t.a,k+'a')}</div>
    <div><label>Marca na parede ${prox}</label>${inp('c','b',t.b,k+'b')}</div>
    <div><label>Diagonal entre as marcas</label>${inp('c','c',t.c,k+'c')}</div>
  </div>
  <label class="chk"><input type="checkbox" data-o="c" data-f="quina" data-t="b"${t.quina?' checked':''}> Quina saliente (canto que avança para dentro do ambiente; meça o triângulo por fora)</label>
  <div class="row wrap"><span class="res" id="cres">${g==null?'— °':isNaN(g)?'medidas não fecham um triângulo':fmtAng(g)+'°'}</span>
    <span class="meta" id="cdif">${g&&!isNaN(g)?(Math.abs(g-90)<=0.3?'no esquadro':`${g>90?'aberto':'fechado'} ${fmtAng(Math.abs(Math.round((g-(t.quina?270:90))*10)/10))}° em relação ao esquadro`):''}</span></div>
  <div class="row wrap">
    <button class="primary" data-a="cantoUsar" data-id="${w.id}">Usar este ângulo</button>
    ${[90,270,135,225].map(v=>`<button data-a="cantoFixo" data-id="${w.id}" data-f="${v}">${v}°</button>`).join('')}
    <button data-a="cantoFechar">Fechar</button>
  </div></div>`}
function parcial(){
  if(view!=='amb')return;const g=geo(A);

  if($('#cres')){const g=anguloCanto(cantoTmp),t=cantoTmp;$('#cres').textContent=g==null?'— °':isNaN(g)?'medidas não fecham um triângulo':fmtAng(g)+'°';
    $('#cdif').textContent=g&&!isNaN(g)?(Math.abs(g-(t.quina?270:90))<=0.3?'no esquadro':`${fmtAng(Math.abs(Math.round((g-(t.quina?270:90))*10)/10))}° fora do esquadro`):''}

const urls={};
async function carregarThumbs(){for(const img of document.querySelectorAll('img[data-foto]')){const id=img.dataset.foto;
  if(!urls[id]){const r=await dbGet('fotos',id).catch(()=>null);if(!r)continue;urls[id]=URL.createObjectURL(r.blobAnot||r.blob)}img.src=urls[id]}}
async function comprimir(file){const bmp=await createImageBitmap(file);const s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}

  if(a.t==='cota'||a.t==='seta'){const ang=Math.atan2(a.y2-a.y1,a.x2-a.x1),t=lw*7;

}

/* ================= leitura da trena ================= */

  if(!alvoKey)return;const el=document.querySelector(`input.laser[data-k="${CSS.escape(alvoKey)}"]`);if(el)el.classList.add('alvo');
  if(alvoKey.startsWith('w:'))selecionarParede(alvoKey.slice(2));
  else if(alvoKey.startsWith('i:')){const it=A&&A.itens.find(i=>i.id===alvoKey.split(':')[1]);if(it)selecionarParede(it.parede)}}
document.addEventListener('focusin',e=>{if(e.target.matches('input.laser')){alvoKey=e.target.dataset.k;marcarAlvo()}});
function leitura(mm){
  const u=$('#ult');u.textContent=mm+' mm';u.classList.add('flash');setTimeout(()=>u.classList.remove('flash'),700);
  if(navigator.vibrate)navigator.vibrate(50);
  if(ED&&!$('#editor').hidden){edReceber(mm);return}
  const el=alvoKey&&document.querySelector(`input.laser[data-k="${CSS.escape(alvoKey)}"]`);
  if(!el){toast(`Leitura ${mm} mm — toque num campo para receber a medida`);return}
  el.value=mm;el.dispatchEvent(new Event('change',{bubbles:true}));
  const list=[...document.querySelectorAll('input.laser')],i=list.findIndex(x=>x.dataset.k===alvoKey),prox=list[i+1];

  marcarAlvo();if(prox)prox.scrollIntoView({block:'center',behavior:'smooth'});toast('✓ '+mm+' mm',1200);
}

/* ================= Bluetooth (Bosch GLM) ================= */
const SVC='02a6c0d0-0451-4000-b000-fb3210111989',CHR='02a6c0d1-0451-4000-b000-fb3210111989';
const SYNC=new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]);
let device=null,chr=null,keep=null,ultPkt='',ultT=0,wake=null;
const hex=dv=>[...new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength)].map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
function btStatus(t,c){$('#btTxt').textContent=t;$('#bt').className='btchip '+(c||'');setTimeout(atualizarFab,0)}
let ultMm=0,ultMmT=0;
function receber(mm){const now=Date.now();if(Math.abs(mm-ultMm)<=1&&now-ultMmT<2000)return;ultMm=mm;ultMmT=now;leitura(mm)}
function onData(ev){const dv=ev.target.value,h=hex(dv);log('← '+h);
  // resposta ao comando MEDIR: 00 04 [uint32 em 1/20 mm] crc
  if(dv.byteLength>=7&&dv.getUint8(0)===0x00&&dv.getUint8(1)===0x04){const mm=Math.round(dv.getUint32(2,true)*0.05);if(mm>10&&mm<300000)receber(mm);return}
  // envio automático da trena: C0 55 10 ... float metros no byte 7
  if(dv.byteLength<11||dv.getUint8(0)!==0xC0||dv.getUint8(1)!==0x55||dv.getUint8(2)!==0x10)return;
  const tipo=dv.getUint8(3);if(tipo===0x02){laserOn=true;laserT=Date.now();atualizarFab();return}if(tipo===0x06){laserOn=false;setTimeout(atualizarFab,0)}
  const now=Date.now();if(h===ultPkt&&now-ultT<1500)return;ultPkt=h;ultT=now;
  const m=dv.getFloat32(7,true);
  if(isFinite(m)&&m>0.01&&m<300)receber(Math.round(m*1000));else log('   valor fora da faixa: '+m)}
// Comando confirmado na GLM 150-27 C (gravado do MeasureOn): equivale a apertar o botão da trena.
// 1º envio acende o laser; 2º envio mede.
const CMD_BOTAO=new Uint8Array([0xC0,0x56,0x01,0x00,0x1E]);
let laserOn=false;
async function enviar(cmd,nome){if(!chr||!device||!device.gatt.connected){toast('Conecte a trena primeiro');return false}
  try{await chr.writeValue(cmd);log('→ '+hex(new DataView(cmd.buffer))+' ('+nome+')');return true}catch(e){log('erro ao enviar '+nome+': '+e.message);toast('A trena não respondeu: '+e.message,3500);return false}}
let laserT=0;const esperar=ms=>new Promise(r=>setTimeout(r,ms));
const laserAceso=()=>laserOn&&Date.now()-laserT<18000;
async function medirRemoto(){const b=$('#fabMedir');if(b.disabled)return;b.disabled=true;b.textContent='Medindo…';
  try{if(!laserAceso()){if(!await enviar(CMD_BOTAO,'botão: laser'))return;await esperar(900)}
    await enviar(CMD_BOTAO,'botão: medir');laserOn=false}
  finally{setTimeout(()=>{b.disabled=false;b.textContent='MEDIR';atualizarFab()},900)}}
async function alternarLaser(){if(laserAceso()){toast('Laser aceso: toque em MEDIR');return}
  if(await enviar(CMD_BOTAO,'botão: laser')){laserOn=true;laserT=Date.now();atualizarFab();setTimeout(atualizarFab,18500)}}
function atualizarFab(){const on=!!(device&&device.gatt.connected);$('#fab').hidden=!on;const a=laserAceso();
  $('#fabLaser').textContent=a?'Laser aceso — mire e meça':'Ligar laser (mirar)';$('#fabLaser').classList.toggle('on',a)}
async function conectar(todos){
  if(!('bluetooth' in navigator)){toast('Bluetooth indisponível: abra pelo Chrome',4000);return}
  try{btStatus('Procurando…','busy');
    device=await navigator.bluetooth.requestDevice(todos?{acceptAllDevices:true,optionalServices:[SVC]}
      :{filters:[{services:[SVC]},{namePrefix:'GLM'},{namePrefix:'Bosch'},{namePrefix:'BOSCH'}],optionalServices:[SVC]});
    device.addEventListener('gattserverdisconnected',()=>{btStatus('Reconectar');clearInterval(keep);log('desconectou')});
    log('aparelho: '+(device.name||'(sem nome)'));await ligarGatt();
  }catch(e){btStatus(device&&device.gatt.connected?'Trena':'Conectar trena');log('erro: '+e.message);if(e.name!=='NotFoundError')toast('Não conectou: '+e.message,4000)}}
async function ligarGatt(){
  btStatus('Conectando…','busy');const srv=await device.gatt.connect();
  chr=await (await srv.getPrimaryService(SVC)).getCharacteristic(CHR);
  chr.addEventListener('characteristicvaluechanged',onData);await chr.startNotifications();
  await chr.writeValue(SYNC);log('→ C0 55 02 01 00 1A (envio automático)');
  clearInterval(keep);keep=setInterval(()=>{if(chr)chr.writeValue(SYNC).catch(()=>{})},20000);
  btStatus(device.name||'Trena','on');toast('Trena conectada');
  try{wake=await navigator.wakeLock.request('screen')}catch(e){}
}
$('#bt').onclick=async()=>{if(device&&device.gatt.connected){toast('Trena conectada: '+(device.name||'GLM'));return}
  if(device){try{await ligarGatt();return}catch(e){log('reconexão falhou: '+e.message)}}conectar(false)};
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&device&&device.gatt.connected&&!wake){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});

/* ================= arquivos e exportação ================= */
async function entregar(nome,blob){

const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});

function geoProj(p){let cur=0;return p.ambientes.map(a=>{const g=geo(a),xs=g.pts.map(q=>q.x),mn=Math.min(...xs),mx=Math.max(...xs),ox=cur-mn;cur+=mx-mn+2000;return {a,g,ox}})}

function dxf(p){
  const o=[],N=n=>(+n||0).toFixed(2);
  const g=(...a)=>{for(let i=0;i<a.length;i+=2)o.push(String(a[i]),String(a[i+1]))};
  g(0,'SECTION',2,'HEADER',9,'$ACADVER',1,'AC1009',9,'$INSUNITS',70,4,0,'ENDSEC',0,'SECTION',2,'ENTITIES');
  const LN=(ly,a,b)=>g(0,'LINE',8,ly,10,N(a[0]),20,N(a[1]),30,N(a[2]),11,N(b[0]),21,N(b[1]),31,N(b[2]));

  const F3=(ly,ps)=>{const arr=[0,'3DFACE',8,ly];ps.forEach((q,i)=>arr.push(10+i,N(q[0]),20+i,N(q[1]),30+i,N(q[2])));g(...arr)};
  for(const {a,g:G,ox} of geoProj(p)){
    const H=a.peDireito||0,ys=G.pts.map(q=>q.y),xs=G.pts.map(q=>q.x);
    TX('TEXTOS',Math.min(...xs)+ox,Math.max(...ys)+450,180,a.nome+(H?'  -  PD '+H:''));
    G.ws.forEach((w,i)=>{const P2=(x,y,z=0)=>[x+ox,y,z],r=rotTxt(w.ux,w.uy);

      TX('COTAS',(w.ax+w.bx)/2+w.ix*260+ox,(w.ay+w.by)/2+w.iy*260,120,LETRAS[i]+' = '+Math.round(w.L)+(w.ok?'':' (sem medida)'),r);
      if(H)F3('PAREDES_3D',[P2(w.ax,w.ay,0),P2(w.bx,w.by,0),P2(w.bx,w.by,H),P2(w.ax,w.ay,H)]);

async function macro(p){

      const fw=pw.fotos||[];for(let k=0;k<fw.length;k++){const fb=await fotoB64(fw[k]);if(!fb)continue;const lx=Math.min(900,w.L/(fw.length+1)*.9),ly=lx*fb.h/fb.w;

        fotos.push({...fb,nome:`Foto ${t.n} ${k+1}`,arq:`ponto_${LETRAS[i]}_${++nf}.jpg`,u:(it.dist||0)+(t.ab?(it.larg||0)/2:0)+k*(lx+40),z:(it.alt||0)+(t.ab?(it.h||0)+ly/2+80:ly/2+120),lx,ly})}
      ws.push({nome:LETRAS[i],ax:w.ax+ox,ay:w.ay,ux:w.ux,uy:w.uy,L:w.L,esq:w.esq,ang:Math.atan2(w.uy,w.ux)*180/Math.PI,canto:+pw.ang||90,
        eS:i>0?+a.paredes[i-1].ang<180:(f&&+a.paredes[n-1].ang<180),eE:(i<n-1||f)&&+a.paredes[i].ang<180,obs:pw.obs||'',fotos})}

# Macro gerada pelo Medidor GLM em ${new Date().toLocaleString('pt-BR')}
# FreeCAD: Macro > Macros... > escolha este arquivo > Executar
# Cada ambiente vira uma pasta; dentro, uma pasta por parede com a parede 3D, notas, pontos e fotos.
import FreeCAD as App, Part, json, base64, os, tempfile
V = App.Vector
D = json.loads(r'''${json}''')
ESP = 150.0  # espessura de parede desenhada (mm), para fora da medida interna
PASTA = tempfile.mkdtemp(prefix='medidor_')

def caixa(w, u0, u1, n0, n1, z0, z1):
    # u: ao longo da parede; n: para fora (positivo) ou para dentro do ambiente (negativo)
    if w['esq']:
        s0, s1 = n0, n1
    else:
        s0, s1 = -n1, -n0

def visual(o, cor, transp=0):

        o.ViewObject.ShapeColor = cor

        pass

def grupo(nome, pai=None):

def foto(w, f, pai):

        import Image
    except Exception:

    except Exception as e:

    o.ImageFile = caminho
    o.XSize = f['lx']
    o.YSize = f['ly']
    o.Label = f['nome']
    u = V(w['ux'], w['uy'], 0)
    esq = V(-w['uy'], w['ux'], 0)
    dentro = esq * (-1 if w['esq'] else 1)
    centro = V(w['ax'], w['ay'], 0) + u * f['u'] + dentro * 6 + V(0, 0, f['z'])
    giro = w['ang'] if w['esq'] else w['ang'] + 180

CORES = {'tomada': (0.84, 0.6, 0.0), 'interruptor': (0.79, 0.5, 0.0), 'luz': (0.88, 0.7, 0.0), 'agua': (0.11, 0.56, 0.84),
         'esgoto': (0.48, 0.32, 0.19), 'gas': (0.84, 0.27, 0.11), 'ar': (0.09, 0.65, 0.58)}

for a in D['ambientes']:

        o.Shape = s
        o.Label = 'Parede %s' % w['nome']
        try:
            o.addProperty('App::PropertyLength', 'Comprimento', 'Medicao')
            o.Comprimento = w['L']
            o.addProperty('App::PropertyAngle', 'CantoNoFim', 'Medicao')
            o.CantoNoFim = w['canto']
            o.addProperty('App::PropertyString', 'Nota', 'Medicao')
            o.Nota = w['obs']
        except Exception:
            pass
        gp.addObject(o)
        visual(o, (0.86, 0.84, 0.79), 35)
        if w['obs']:
            nota(w['obs'], 'Notas parede ' + w['nome'], gp)
        if w['fotos']:
            gf = grupo('Fotos parede ' + w['nome'], gp)
            for f in w['fotos']:

    for it in a['itens']:
        if it['p'] < 0:
            continue
        w = a['ws'][it['p']]
        if it['ab']:
            rot = '%s %dx%d - dist %d / h %d' % (it['nome'], round(it['larg']), round(it['h']), round(it['dist']), round(it['alt']))
        else:
            rot = '%s - dist %d / h %d' % (it['nome'], round(it['dist']), round(it['alt']))
        if it['obs']:
            rot += ' - ' + it['obs']
        if it['tipo'] == 'viga' and it['larg'] > 0 and it['h'] > 0:
            o = doc.addObject('Part::Feature', 'Viga')
            o.Shape = caixa(w, it['dist'], it['dist'] + it['larg'], -100, 0, it['alt'], it['alt'] + it['h'])
            visual(o, (0.55, 0.31, 0.69), 50)
        elif it['ab']:
            continue
        else:
            c = V(w['ax'], w['ay'], 0) + V(w['ux'], w['uy'], 0) * it['dist'] + V(0, 0, it['alt'])
            o = doc.addObject('Part::Feature', 'Ponto')
            o.Shape = Part.makeSphere(40, c)
            visual(o, CORES.get(it['tipo'], (0.4, 0.4, 0.4)))
        o.Label = rot
        gps[it['p']].addObject(o)
    if a['fechado'] and len(a['pts']) > 3:
        try:
            f = Part.Face(Part.makePolygon([V(x, y, 0) for x, y in a['pts']]))
            o = doc.addObject('Part::Feature', 'Piso')
            o.Shape = f
            o.Label = 'Piso ' + a['nome']
            ga.addObject(o)
            visual(o, (0.75, 0.82, 0.77), 20)
        except Exception as e:
            App.Console.PrintWarning('Piso nao criado: %s\\n' % e)
doc.recompute()
try:

`;
}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

async function zipar(arqs){const enc=new TextEncoder(),partes=[],central=[];let off=0;

    const n=enc.encode(f.nome),c=crc32(d),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
    partes.push(h.buffer,n,d);
    const cd=new DataView(new ArrayBuffer(46));cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(8,0x0800,true);cd.setUint16(14,0x21,true);
    cd.setUint32(16,c,true);cd.setUint32(20,d.length,true);cd.setUint32(24,d.length,true);cd.setUint16(28,n.length,true);cd.setUint32(42,off,true);
    central.push(cd.buffer,n);off+=30+n.length+d.length}

  e.setUint32(0,0x06054b50,true);e.setUint16(8,arqs.length,true);e.setUint16(10,arqs.length,true);e.setUint32(12,tam,true);e.setUint32(16,off,true);

/* ================= eventos ================= */
function obj(o,id){if(o==='c')return cantoTmp;if(o==='p')return P;if(o==='a')return A;if(o==='w')return A.paredes.find(w=>w.id===id);if(o==='i')return A.itens.find(i=>i.id===id)}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');
  if(!e.target.closest('#menu')&&!e.target.closest('#menuBtn'))$('#menu').hidden=true;
  if(!b)return;const a=b.dataset.a,id=b.dataset.id,f=b.dataset.f;
  switch(a){
    case 'novoProj':P={id:uid(),cliente:'',endereco:'',obs:'',criado:Date.now(),ambientes:[]};projetos.push(P);await dbPut('projetos',P);view='projeto';render();setTimeout(()=>$('#pc')&&$('#pc').focus(),60);break;
    case 'abrirProj':P=projetos.find(p=>p.id===id);A=null;view='projeto';render();scrollTo(0,0);break;
    case 'abrirAmb':A=P.ambientes.find(x=>x.id===id);selW=null;alvoKey=A.peDireito?null:'pd';view='amb';render();scrollTo(0,0);break;
    case 'novoAmb':{const angs=f==='L'?[90,90,270,90,90,90]:f==='1'?[90]:[90,90,90,90];
      A={id:uid(),nome:'Ambiente '+(P.ambientes.length+1),peDireito:null,paredes:angs.map(v=>({id:uid(),L:null,ang:v})),itens:[],fotos:[],obs:'',diag1:null,diag2:null};
      P.ambientes.push(A);salvar();selW=null;alvoKey='pd';view='amb';render();scrollTo(0,0);toast('Dê um nome ao ambiente e meça o pé-direito');break;}
    case 'addW':{const w={id:uid(),L:null,ang:90};A.paredes.push(w);salvar();selW=w.id;alvoKey='w:'+w.id;render();break;}
    case 'delW':if(!dupla(b))return;{const w=A.paredes.find(x=>x.id===id);for(const fo of [...(w&&w.fotos||[]),...A.itens.filter(i=>i.parede===id).flatMap(i=>i.fotos)])dbDel('fotos',fo).catch(()=>{});}A.itens=A.itens.filter(i=>i.parede!==id);A.paredes=A.paredes.filter(w=>w.id!==id);salvar();render();break;
    case 'selW':selecionarParede(id);break;
    case 'addI':{if(!A.paredes.length){toast('Adicione uma parede primeiro');return}
      const w=selW||A.paredes[0].id,it={id:uid(),tipo:f,parede:w,dist:null,alt:(f==='porta'||f==='vao')?0:null,larg:null,h:null,obs:'',fotos:[]};
      A.itens.push(it);salvar();alvoKey='i:'+it.id+':dist';render();
      const el=document.querySelector(`[data-k="${CSS.escape(alvoKey)}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
      toast(`${TIPOS[f].n} na parede ${letra(w)} — meça a distância`);break;}
    case 'delI':if(!dupla(b))return;{const it=A.itens.find(i=>i.id===id);if(it)for(const fo of it.fotos)dbDel('fotos',fo).catch(()=>{});}
      A.itens=A.itens.filter(i=>i.id!==id);salvar();render();break;
    case 'delAmb':if(!dupla(b))return;for(const fo of fotosAmb(A))dbDel('fotos',fo).catch(()=>{});
      P.ambientes=P.ambientes.filter(x=>x!==A);A=null;salvar();view='projeto';render();break;
    case 'delProj':if(!dupla(b))return;for(const fo of P.ambientes.flatMap(fotosAmb))dbDel('fotos',fo).catch(()=>{});
      await dbDel('projetos',P.id);projetos=projetos.filter(p=>p!==P);P=null;view='lista';render();break;
    case 'exp':exportar(f);break;
    case 'importar':$('#impFile').click();break;
    case 'verFoto':verFoto(id,b.dataset.dono);break;
    case 'mTodos':conectar(true);break;
    case 'mDesc':if(device&&device.gatt.connected){device.gatt.disconnect();toast('Trena desconectada')}break;
    case 'mDiag':if(view!=='diag'&&view!=='ajuda')prevView=view;view='diag';render();break;
    case 'mAjuda':if(view!=='diag'&&view!=='ajuda')prevView=view;view='ajuda';render();break;
    case 'copLog':try{await navigator.clipboard.writeText(logLines.join('\n'));toast('Diagnóstico copiado')}catch(_){toast('Não consegui copiar')}break;
    case 'ficha':fichaAberta=fichaAberta===id?null:id;cantoAberto=null;selW=id;render();break;
    case 'fichaFechar':fichaAberta=null;render();break;
    case 'canto':fichaAberta=null;cantoAberto=cantoAberto===id?null:id;cantoTmp={};selW=id;alvoKey=cantoAberto?'c:'+id+':a':alvoKey;render();break;
    case 'cantoFechar':cantoAberto=null;render();break;
    case 'cantoFixo':{const w=A.paredes.find(x=>x.id===id);if(w){w.ang=+f;salvar()}cantoAberto=null;render();break;}
    case 'cantoUsar':{const g=anguloCanto(cantoTmp),w=A.paredes.find(x=>x.id===id);if(g==null||isNaN(g)){toast('Meça as duas marcas e a diagonal');return}
      w.ang=g;salvar();cantoAberto=null;render();toast('Canto ajustado para '+fmtAng(g)+'°');break;}
    case 'simular':leitura(1000+Math.round(Math.random()*3000));break;
  }
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='prefShare'){prefShare=el.checked;ls.set('glm_share',prefShare?'1':'0');return}
  if(el.id==='impFile'){await importar(el.files[0]);el.value='';return}
  if(el.dataset.fotoO){const files=[...el.files];el.value='';
    const dono=el.dataset.fotoO==='a'?A:el.dataset.fotoO==='w'?A.paredes.find(w=>w.id===el.dataset.id):A.itens.find(i=>i.id===el.dataset.id);if(!dono)return;if(!dono.fotos)dono.fotos=[];
    let ultId=null;for(const file of files){try{const blob=await comprimir(file),id=uid();await dbPut('fotos',{id,blob});dono.fotos.push(id);ultId=id}catch(err){toast('Não consegui salvar a foto: '+err.message,4000)}}
    salvar();render();if(ultId&&files.length===1)abrirEditor(ultId);else toast('Foto salva');return}
  const o=el.dataset.o;if(!o)return;const t=obj(o,el.dataset.id);if(!t)return;
  let v=el.value;if(el.dataset.t==='b')v=el.checked;else if(el.dataset.t==='n'){v=v.trim()===''?null:num(v);if(v!=null)v=Math.round(v)}
  t[el.dataset.f]=v;salvar();
  if(el.dataset.full)render();else if(view==='amb')parcial();else if(o==='p')titulo(P.cliente||'Novo projeto',P.endereco||'Projeto');
});
$('#voltar').onclick=()=>{if(view==='amb'){A=null;view='projeto'}else if(view==='projeto'){P=null;view='lista'}else if(view==='diag'||view==='ajuda'){view=prevView;if(view==='amb'&&!A)view=P?'projeto':'lista'}render();scrollTo(0,0)};
$('#fabMedir').onclick=medirRemoto;$('#fabLaser').onclick=alternarLaser;
$('#menuBtn').onclick=()=>{$('#menu').hidden=!$('#menu').hidden};

/* ================= início ================= */
(async()=>{
  try{await abrirDB();projetos=await dbAll('projetos')}catch(e){toast('Erro ao abrir os dados: '+e.message,5000)}
  try{const n=JSON.parse(ls.get('glm_nav')||'{}');P=projetos.find(p=>p.id===n.p)||null;A=P&&P.ambientes.find(a=>a.id===n.a)||null;
    view=A?'amb':P?'projeto':'lista'}catch(e){view='lista'}
  render();
  if(!('bluetooth' in navigator))btStatus('Sem Bluetooth');
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
